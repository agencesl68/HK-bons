      if (location.hash && location.hash !== '#/') route(); else { location.hash = '#/'; route(); }
    } catch (e2) {
      err.hidden = false; err.querySelector('span').textContent = e2.message;
      btn.classList.remove('is-busy'); btn.textContent = 'Se connecter';
    }
  });
}

/* -------------------------------------------- conversion app <-> base -- */
const estUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || '');
const COLS = 'id,numero,statut,date,maj_le,signe_le,client,chantier,num_chantier,num_commande,chef,chef_email,materiel,designation,immat,conducteur,minutes,facturation,mail,agenda_uid';
// Colonnes « à plat » du registre : le premier engin sert de repère, les
// autres sont listés dans « designation ». Le bon complet est dans « donnees ».
function versLigne(bl) {
  const { id, numero, statut, pdf, mail, creeLe, majLe, ...donnees } = bl;
  const engins = enginsRemplis(bl), joint = f => engins.map(f).filter(Boolean).join(' · ');
  return {
    date: bl.date, client: bl.client.nom || '', chantier: bl.chantier.nom || bl.chantier.ville || '',
    num_chantier: bl.chantier.numero || '', num_commande: bl.chantier.commande || '',
    chef: bl.chef.nom || '', chef_email: bl.chef.email || '', materiel: engins[0]?.type || '',
    designation: designationPrincipale(bl) || '', immat: joint(e => e.immat), conducteur: joint(e => e.conducteur),
    facturation: engins[0]?.facturation?.mode || '', minutes: minutesTotal(bl), quantite: totalMateriaux(bl) || null,
    agenda_uid: bl.source?.agendaUid || null, donnees,
  };
}
/* Le PDF n'est stocké nulle part : il est refabriqué à l'identique depuis le
   bon enregistré, qui est figé au moment de la signature. « gen:<id> » veut
   dire « fabrique-moi le PDF de ce bon ». */
const infoPdf = r => (r.statut !== 'brouillon' && r.numero ? { url: `gen:${r.id}`, fichier: `BL-${r.numero}.pdf`, taille: null } : null);
const versResume = r => ({
  id: r.id, numero: r.numero, statut: r.statut, date: r.date, majLe: r.maj_le, signeLe: r.signe_le,
  client: r.client, chantier: r.chantier, numChantier: r.num_chantier, commande: r.num_commande,
  chef: r.chef, chefEmail: r.chef_email, materiel: r.materiel, materielLibre: r.designation, designation: r.designation,
  immat: r.immat, conducteur: r.conducteur, minutes: r.minutes, facturation: r.facturation,
  pdf: infoPdf(r), mail: r.mail, agendaUid: r.agenda_uid,
});
const versBL = r => ({ ...r.donnees, id: r.id, numero: r.numero, statut: r.statut, date: r.date, pdf: infoPdf(r), mail: r.mail, creeLe: r.cree_le, majLe: r.maj_le });

/* ------------------------------------------------ mail (envoyé par Make) -- */
function contenuMail(bl) {
  const E = CFG.entreprise || {}, mins = minutesTotal(bl);
  const chantier = bl.chantier.nom || bl.chantier.ville || '';
  const subject = `Bon de location N° ${bl.numero} — ${chantier || bl.client.nom || E.nom} — ${frDate(bl.date)}`;
  const engins = enginsRemplis(bl);
  const ligne = (k, v) => v ? `<tr><td style="padding:9px 0;color:#716C64;font-size:13px;width:44%;border-bottom:1px solid #ECE7DE">${esc(k)}</td><td style="padding:9px 0;color:#17181B;font-size:14px;font-weight:600;border-bottom:1px solid #ECE7DE">${esc(v)}</td></tr>` : '';
  const html = `<!doctype html><html lang="fr"><body style="margin:0;background:#F4F2ED;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F2ED;padding:28px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:18px;overflow:hidden">
<tr><td style="background:#141518;padding:22px 28px;border-bottom:3px solid #FE6001"><div style="font-size:22px;font-weight:900;color:#FE6001">HK <span style="color:#FFFFFF;font-weight:700;letter-spacing:.2em;font-size:13px">TERRASSEMENT</span></div></td></tr>
<tr><td style="padding:28px 28px 8px"><div style="font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#B24700">Bon de location signé</div>
<div style="font-size:30px;font-weight:800;color:#17181B;margin:6px 0 2px">N° ${esc(bl.numero)}</div>
<div style="font-size:14px;color:#42444A">Bonjour${bl.chef.nom ? ' ' + esc(bl.chef.nom) : ''}, vous trouverez ci-joint le bon de location signé sur le chantier.</div></td></tr>
<tr><td style="padding:12px 28px 4px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0">
${ligne('Date', frDate(bl.date))}${ligne('Client', bl.client.nom)}${ligne('Chantier', chantier)}${ligne('N° chantier', bl.chantier.numero)}${ligne('N° commande', bl.chantier.commande)}${engins.map(e => ligne(engins.length > 1 ? designationEngin(e) : 'Matériel', engins.length > 1 ? [e.conducteur, minutesEngin(e) ? fmtH(minutesEngin(e)) : ''].filter(Boolean).join(' · ') : designationEngin(e))).join('')}${ligne(engins.length > 1 ? 'Total des heures' : 'Heures', mins ? fmtH(mins) : '')}${ligne('Signé par', bl.signature?.nom)}
</table></td></tr>
<tr><td style="padding:18px 28px 28px"><div style="background:#FFF1E6;border-radius:12px;padding:14px 16px;font-size:13px;color:#B24700">PDF joint : <b>BL-${esc(bl.numero)}.pdf</b></div></td></tr>

</table></td></tr></table></body></html>`;

}

// Une ligne par bon pour le classeur Google Sheets (colonnes dans cet ordre)
const ligneSheets = (bl, chemin) => {
  const engins = enginsRemplis(bl), joint = f => engins.map(f).filter(Boolean).join(' · ');
  return {
    numero: bl.numero, date: frDate(bl.date), client: bl.client.nom, chantier: bl.chantier.nom || bl.chantier.ville,

    tours: totalTours(bl) || '', signe_par: bl.signature?.nom, signe_le: frDateTime(bl.signature?.date),
    saisi_par: Session.employe?.nom || joint(e => e.conducteur) || '', fichier: chemin,

};

// Le PDF voyage dans le message (« pdfBase64 ») : Make n'a pas besoin d'aller
// le rechercher, et l'app des chauffeurs n'a aucun droit de lecture à donner.
const blobEnBase64 = b => new Promise((ok, ko) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = ko; fr.readAsDataURL(b); });

async function envoyerAuChef(id, bl, chemin, destinataire, pdfBase64) {
  const le = new Date().toISOString();
  let mail;
  if (!destinataire) mail = { statut: 'sans-email', le };
  else if (!CFG.makeWebhookUrl) mail = { statut: 'attente', to: destinataire, le };
  else {
    try {
      const { subject, html } = contenuMail(bl);
      // le PDF voyage dans le message : laisser le temps à un réseau de chantier
      const r = await fetchDelai(CFG.makeWebhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jeton: CFG.makeJeton || '', to: destinataire, cc: CFG.copieBureau || '', subject, html,
          pdfName: `BL-${bl.numero}.pdf`, pdfBase64, bon: ligneSheets(bl, chemin) }) }, 60000);
      if (!r.ok) console.warn(`[HK] webhook d'envoi : réponse ${r.status}`);
      mail = r.ok ? { statut: 'envoye', mode: 'auto', to: destinataire, subject, le } : { statut: 'erreur', to: destinataire, le };
    } catch (e) { console.warn('[HK] webhook d\'envoi injoignable :', e.message); mail = { statut: 'erreur', to: destinataire, le }; }
  }
  if (ANON) await SB.rpc('bl_terrain_mail', { p_id: id, p_mail: mail, p_envoye: mail.statut === 'envoye' });
  else await SB.rest(`bons_location?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: { mail, statut: mail.statut === 'envoye' ? 'envoye' : 'signe' } });
  return mail;
}

/* -------------------------------------------- routes de l'app -> Supabase -- */
async function apiSupabase(method, chemin, body) {
  const u = new URL(chemin, 'https://x'), p = u.pathname.split('/').filter(Boolean), q = u.searchParams;

  if (p[0] === 'config') {
    const yy = String(new Date().getFullYear()).slice(2);
    let prochain = '';
    if (!ANON) try { const c = await SB.rest(`bl_compteurs?annee=eq.${yy}&select=dernier`); prochain = `${yy}-${String((c?.[0]?.dernier || 0) + 1).padStart(4, '0')}`; } catch { /* compteur pas encore créé */ }
    return { entreprise: CFG.entreprise, document: CFG.document, agenda: { source: 'google' },
      mail: { mode: CFG.makeWebhookUrl ? 'make' : 'aucun' }, prochainNumero: prochain, employe: Session.employe };
  }

  if (p[0] === 'agenda') {
    const du = q.get('from'), au = q.get('to') || du;
    const [evs, lies] = await Promise.all([
      SB.rest(`agenda_bl?select=*&date=gte.${du}&date=lte.${au}&order=date,debut.nullsfirst`),
      ANON ? [] : SB.rest(`bons_location?select=${COLS}&agenda_uid=not.is.null&date=gte.${du}&date=lte.${au}`),
    ]);
    // Le lien des chauffeurs ne lit pas la base : il se souvient de ce qu'il a fait sur ce téléphone.
    const parEvt = ANON ? bonsLocauxParEvenement() : Object.fromEntries(lies.map(r => [`${r.agenda_uid}|${r.date}`, versResume(r)]));
    return { source: 'google', events: evs.map(e => ({ uid: e.uid, titre: e.titre, lieu: e.lieu, description: e.description, date: e.date,
      debut: e.debut ? e.debut.slice(0, 5) : '', fin: e.fin ? e.fin.slice(0, 5) : '', journee: e.journee, bon: parEvt[`${e.uid}|${e.date}`] || null })) };
  }

  if (p[0] !== 'bons') throw new Error('Route inconnue');
  const id = p[1];

  // Registre : réservé à la direction. Le lien des chauffeurs ne lit rien.
  if (!id && method === 'GET') {
    if (ANON) return { bons: brouillonsLocaux().map(resumeLocal) };
    return { bons: (await SB.rest(`bons_location?select=${COLS}&order=date.desc,numero.desc.nullsfirst&limit=1000`)).map(versResume) };
  }
  if (!id && method === 'POST') {
    const ligne = versLigne(body); ligne.id = estUuid(body.id) ? body.id : uid();
    if (ANON) {   // création à l'aveugle : la base ne renvoie rien, l'app garde son exemplaire
      await SB.rpc('bl_terrain_enregistrer', { p_id: ligne.id, p_bon: ligne });
      return { ...body, id: ligne.id, numero: null, statut: 'brouillon', creeLe: new Date().toISOString() };
    }
    const r = await SB.rest(`bons_location?select=*`, { method: 'POST', prefer: 'return=representation', body: ligne });
    return versBL(r[0]);
  }
  if (!p[2] && method === 'GET') {
    if (ANON) {
      const local = LS.get(CLE(`backup:${id}`), null);
      if (!local) throw new Error('Ce bon n\'est plus sur cet appareil. Le bureau le retrouve dans le registre.');
      return local;
    }
    const r = await SB.rest(`bons_location?id=eq.${id}&select=*`);
    if (!r?.length) throw new Error('Bon introuvable');
    return versBL(r[0]);
  }
  if (!p[2] && method === 'PUT') {
    if (ANON) await SB.rpc('bl_terrain_enregistrer', { p_id: id, p_bon: versLigne(body) });
    else await SB.rest(`bons_location?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: versLigne(body) });
    return { ok: true };
  }
  if (!p[2] && method === 'DELETE') {
    if (ANON) await SB.rpc('bl_terrain_supprimer', { p_id: id });
    else await SB.rest(`bons_location?id=eq.${id}`, { method: 'DELETE' });
    return { ok: true };
  }
  if (p[2] === 'numero') return { numero: await SB.rpc('bl_attribuer_numero', { p_id: id }) };

  if (p[2] === 'signer') {
    const { bon, pdfBase64 } = body;
    const fichier = `BL-${bon.numero}.pdf`;
    const signeLe = bon.signature?.date || new Date().toISOString();
    if (ANON) await SB.rpc('bl_terrain_signer', { p_id: id, p_bon: versLigne(bon), p_signe_le: signeLe });
    else await SB.rest(`bons_location?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal',
      body: { ...versLigne(bon), statut: 'signe', signe_le: signeLe } });
    const mail = await envoyerAuChef(id, bon, fichier, bon.chef?.email?.trim(), pdfBase64);
    if (!ANON) return apiSupabase('GET', `/bons/${id}`);
    // Lien des chauffeurs : le PDF reste dans le téléphone pour être ouvert et partagé
    state.pdfFichier = new File([Uint8Array.from(atob(pdfBase64), c => c.charCodeAt(0))], fichier, { type: 'application/pdf' });
    return { ...bon, statut: mail.statut === 'envoye' ? 'envoye' : 'signe', mail, pdf: { url: `local:${fichier}`, fichier, taille: state.pdfFichier.size } };
  }

  if (p[2] === 'renvoyer') {
    const dest = (body.email || '').trim();
    if (ANON) {
      const bl = state.bl;
      if (!state.pdfFichier) throw new Error('Le PDF n\'est plus sur cet appareil : le bureau peut le renvoyer depuis le registre.');
      const mail = await envoyerAuChef(id, bl, bl.pdf?.fichier || '', dest || bl.chef.email, await blobEnBase64(state.pdfFichier));
      return { ...bl, mail };
    }
    const bl = await apiSupabase('GET', `/bons/${id}`);
    const pdf = await pdfDuBon(id);
    await envoyerAuChef(id, bl, pdf.name, dest || bl.chef.email, await blobEnBase64(pdf));
    return apiSupabase('GET', `/bons/${id}`);
  }
  throw new Error('Action inconnue');
}

if (MODE === 'supabase') { api = apiSupabase; if (!ANON) Session.charger(); }   // le lien ouvert n'a pas de session, et n'emprunte pas celle du bureau

/* ------------------------------------------------- PDF : liens et partage --
   « local: »  le PDF qui vient d'être signé, encore dans le téléphone
   « gen:id »  à refabriquer depuis le bon enregistré (registre du bureau)
   autre       fichier servi par le serveur local (npm start)               */
const pdfsRefaits = new Map();

async function pdfDuBon(id) {
  if (pdfsRefaits.has(id)) return pdfsRefaits.get(id);
  const bl = newBL(await api('GET', `/bons/${id}`));
  const doc = await buildPdf(bl);
  const f = new File([doc.output('blob')], `BL-${bl.numero}.pdf`, { type: 'application/pdf' });
  pdfsRefaits.set(id, f);
  return f;
}

// Renvoie un vrai fichier quand le PDF vit dans le téléphone, sinon null
async function fichierPdf(url) {
  if (url.startsWith('local:')) {
    if (!state.pdfFichier) throw new Error('Le PDF n\'est plus en mémoire : rouvrez le bon depuis le registre du bureau.');
    return state.pdfFichier;
  }
  if (url.startsWith('gen:')) return pdfDuBon(url.slice(4));
  return null;
}

async function lienPdf(url, telecharger = '') {
  const f = await fichierPdf(url);
  if (f) return URL.createObjectURL(f);
  return telecharger ? `${url}?dl=1` : url;
}

// Registre en CSV (Excel / Google Sheets), fabriqué dans le téléphone
function exporterCsv(bons) {
  const cols = ['N°', 'Date', 'Statut', 'Client', 'Chantier', 'N° chantier', 'N° commande', 'Chef de chantier', 'Email chef', 'Matériel', 'Immatriculation', 'Conducteur', 'Facturation', 'Heures', 'Signé le', 'Mail'];
  const e = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lignes = bons.filter(b => b.statut !== 'brouillon').map(b => [b.numero, frDate(b.date), b.statut, b.client, b.chantier, b.numChantier, b.commande, b.chef, b.chefEmail,
    b.designation || matById(b.materiel)?.label || b.materiel, b.immat, b.conducteur, factLabel(b.facturation), fmtDec(b.minutes), b.signeLe ? frDateTime(b.signeLe) : '', b.mail?.statut || ''].map(e).join(';'));
  telechargerBlob(new Blob(['﻿' + [cols.join(';'), ...lignes].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `registre-BL-HK-${isoDay()}.csv`);
}

<script>
/* =============================================================================
   PDF — bon de location A4 paysage, même structure que le bon CTE,
   aux couleurs HK. Vectoriel (jsPDF), logo + signature en PNG.
   ============================================================================= */
'use strict';

const buildPdf = (() => {
  const C = {
    ink: [23, 24, 27], ink2: [66, 68, 74], muted: [113, 108, 100], line: [221, 215, 204], line1: [236, 231, 222],
    accent: [254, 96, 1], accentInk: [178, 71, 0], soft: [255, 241, 230], dark: [20, 21, 24], s2: [251, 250, 247], white: [255, 255, 255],
  };
  let logoCache = null;
  const toDataUrl = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  async function logo() {
    if (!logoCache) logoCache = await fetch(LOGO_URL).then(r => r.blob()).then(toDataUrl);
    return logoCache;
  }
  const imgSize = src => new Promise(res => { const i = new Image(); i.onload = () => res([i.naturalWidth, i.naturalHeight]); i.onerror = () => res([4, 1]); i.src = src; });
  // Polices standard PDF = WinAnsi : on normalise les caractères hors table.
  const clean = s => String(s ?? '').replace(/[   ]/g, ' ').replace(/[→⟶]/g, '>').replace(/[‘’]/g, "'").replace(/[“”«»]/g, '"')
    .replace(/[^\x09\x0A\x20-\x7E -ÿ€œŒ–—•…’]/g, '');

  return async function buildPdf(bl, { apercu = false } = {}) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    const E = state.config?.entreprise || { nom: 'HK Terrassement', adresse: '3 rue des Roseaux', cpVille: '68580 UEBERSTRASS', tel: '06 42 76 96 88', email: 'contact@hkterrassement.fr' };
    const D = state.config?.document || { titre: 'BON DE LOCATION', mentions: [] };
    const engins = enginsRemplis(bl), seul = engins.length === 1;
    const e0 = engins[0] || newEngin();
    const m = matById(e0.type), cat = m?.cat, f = e0.facturation, h = e0.horaires;
    const rows = lignesBL(bl);
    const ref = String(bl.id).replace(/-/g, '').slice(0, 8).toUpperCase();

    const font = (style, size) => { doc.setFont('helvetica', style); doc.setFontSize(size); };
    const color = c => doc.setTextColor(...c);
    const T = (s, x, y, o) => doc.text(clean(s), x, y, o);
    const fit = (s, w) => { s = clean(s); if (doc.getTextWidth(s) <= w) return s; while (s.length && doc.getTextWidth(s + '…') > w) s = s.slice(0, -1); return s + '…'; };
    const box = (x, y, w, hh, fill) => { doc.setDrawColor(...C.line); doc.setLineWidth(.3); if (fill) doc.setFillColor(...fill); doc.roundedRect(x, y, w, hh, 1.8, 1.8, fill ? 'FD' : 'S'); };
    const sect = (t, x, y) => { doc.setFillColor(...C.accent); doc.rect(x, y - 2.1, 1.5, 2.3, 'F'); font('bold', 6.9); color(C.accentInk); T(t.toUpperCase(), x + 3, y, { charSpace: .35 }); };
    const lv = (label, value, x, y, w, { bold = false, size = 8.6 } = {}) => {
      font('bold', 6.4); color(C.muted); const lab = clean(label.toUpperCase()); T(lab, x, y, { charSpace: .15 });
      const lw = doc.getTextWidth(lab) + lab.length * .15 + 1.6;
      font(bold ? 'bold' : 'normal', size); color(C.ink); T(fit(value || '', w - lw), x + lw, y);
    };
    const radio = (x, y, on, label, w) => {
      doc.setLineWidth(.3); doc.setDrawColor(...(on ? C.accent : C.muted));
      doc.circle(x + 1.4, y - 1, 1.35, 'S');
      if (on) { doc.setFillColor(...C.accent); doc.circle(x + 1.4, y - 1, .8, 'F'); }
      font(on ? 'bold' : 'normal', 7.9); color(on ? C.ink : C.ink2); T(fit(label, w - 5), x + 4.2, y);
    };

    const footer = (page, pages) => {
      font('normal', 6.7); color(C.accentInk);
      (D.mentions || []).slice(0, 2).forEach((txt, i) => T(`* ${txt}`, 10, 202.5 + i * 3.4));
      font('normal', 6.7); color(C.muted);
      T(`${E.nom} · ${E.adresse}, ${E.cpVille} · Document numérique · Réf. ${ref} · Page ${page}/${pages}`, 287, 205.9, { align: 'right' });
      if (apercu) {
        doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: .07 }));
        font('bold', 120); color(C.accent);
        const txt = 'APERÇU', tw = doc.getTextWidth(txt), a = 16 * Math.PI / 180;
        doc.text(txt, 148.5 - tw / 2 * Math.cos(a), 118 + tw / 2 * Math.sin(a), { angle: 16 });
        doc.restoreGraphicsState();
      }
    };

    const tableCols = [['Désignation / matériaux', 76], ['Lieu de chargement', 52], ['Lieu de déchargement', 52], ['Tours', 15, 'center'], ['Quantité', 22, 'right'], ['Unité', 18, 'center'], ['N° de pesée', 42]];
    const drawTable = (y0, list, nRows) => {
      const rh = 6.6;
      doc.setFillColor(...C.dark); doc.rect(10, y0, 277, 7, 'F');
      doc.setFillColor(...C.accent); doc.rect(10, y0 + 7, 277, .7, 'F');
      let x = 10;
      font('bold', 6.6); color(C.white);
      tableCols.forEach(([lab, w, al]) => { const tx = al === 'right' ? x + w - 2.2 : al === 'center' ? x + w / 2 : x + 2.2; T(lab.toUpperCase(), tx, y0 + 4.6, { align: al || 'left', charSpace: .2 }); x += w; });
      for (let i = 0; i < nRows; i++) {
        const y = y0 + 7.7 + i * rh, r = list[i];
        if (i % 2 === 1) { doc.setFillColor(...C.s2); doc.rect(10, y, 277, rh, 'F'); }
        if (r?.type === 'principal') { doc.setFillColor(...C.soft); doc.rect(10, y, 277, rh, 'F'); }
        doc.setDrawColor(...C.line1); doc.setLineWidth(.2); doc.line(10, y + rh, 287, y + rh);
        if (!r) continue;
        const cells = [r.designation, r.depart, r.arrivee, r.tours, r.qte, r.unite, r.pesee];
        x = 10;
        tableCols.forEach(([, w, al], ci) => {
          const v = cells[ci]; if (v) {
            font(ci === 0 && r.type === 'principal' || ci === 4 ? 'bold' : 'normal', 8.3); color(r.type === 'suite' ? C.muted : C.ink);
            const tx = al === 'right' ? x + w - 2.2 : al === 'center' ? x + w / 2 : x + 2.2;
            T(fit(v, w - 4.4), tx, y + 4.4, { align: al || 'left' });
          }
          x += w;
        });
      }
      x = 10; doc.setDrawColor(...C.line1); doc.setLineWidth(.2);
      tableCols.slice(0, -1).forEach(([, w]) => { x += w; doc.line(x, y0 + 7.7, x, y0 + 7.7 + nRows * rh); });
      doc.setDrawColor(...C.line); doc.setLineWidth(.3); doc.rect(10, y0, 277, 7.7 + nRows * rh, 'S');
      return y0 + 7.7 + nRows * rh;
    };

    /* ---------- page 1 ---------- */
    const FIRST = 9;
    const pageRows = rows.length > FIRST ? [...rows.slice(0, FIRST - 1), { type: 'suite', designation: `… ${rows.length - FIRST + 1} ligne(s) supplémentaire(s) en page suivante` }] : rows;
    const rest = rows.length > FIRST ? rows.slice(FIRST - 1) : [];
    const PER_PAGE = 22;
    const pages = 1 + Math.ceil(rest.length / PER_PAGE);

    const lg = await logo();
    doc.addImage(lg, 'PNG', 10, 8.5, 31, 24.3, 'hk-logo', 'FAST');
    font('bold', 11.5); color(C.ink); T(E.nom.toUpperCase(), 45, 14.5, { charSpace: .25 });
    font('normal', 8.4); color(C.ink2); T(E.adresse, 45, 20); T(E.cpVille, 45, 24.2);
    font('bold', 8.4); color(C.ink); T(E.tel, 45, 28.6);
    font('normal', 8.4); color(C.ink2); T(E.email, 45, 32.8);

    font('bold', 17); color(C.ink); T(D.titre || 'BON DE LOCATION', 148.5, 16.5, { align: 'center', charSpace: .5 });
    doc.setFillColor(...C.accent); doc.rect(139.5, 19.3, 18, 1.1, 'F');
    font('bold', 15); color(C.accent); T(`N° ${bl.numero || (apercu ? 'attribué à la signature' : '—')}`, 148.5, 27.5, { align: 'center' });
    font('normal', 8.8); color(C.ink2); T(`Date : ${frDate(bl.date)}`, 148.5, 33.2, { align: 'center' });

    box(190, 8.5, 97, 30);
    lv('Client :', bl.client.nom, 193, 14, 91, { bold: true, size: 9.2 });
    lv('Adresse :', bl.client.adresse, 193, 19.2, 91);
    lv('N° CDE :', bl.chantier.commande, 193, 24.4, 45, { bold: true }); lv('N° chantier :', bl.chantier.numero, 240, 24.4, 45, { bold: true });
    lv('Chef de chantier :', bl.chef.nom, 193, 29.6, 91, { bold: true });
    lv('Tél. chef :', bl.chef.tel, 193, 34.8, 40); lv('Email :', bl.chef.email, 234, 34.8, 51);

    box(10, 42, 177, 33);
    sect('Types de camions & engins', 13, 47.3);
    MATERIEL.forEach((item, i) => {
      const col = i % 4, rowI = Math.floor(i / 4);
      const pris = engins.find(e => e.type === item.id);
      let label = item.label;
      if (pris && item.cat === 'autre' && pris.libreDesignation) label = `Autre : ${pris.libreDesignation}`;
      if (pris && item.cat === 'transfert') label = `Transfert (${pris.facturation.mode === 'forfait' ? 'forfait' : 'heure'})`;
      radio(13 + col * 43.5, 53.8 + rowI * 5.6, !!pris, label, 43.5);
    });

    box(190, 42, 97, 33);
    sect(seul ? 'Matériel & conducteur' : `Engins & conducteurs (${engins.length})`, 193, 47.3);
    if (seul) {
      lv(cat === 'pelle' ? 'N° engin / immat :' : 'N° immat camion :', e0.immat, 193, 53.8, 91, { bold: true, size: 9.2 });
      lv('N° remorque :', m?.remorque ? e0.remorque : (e0.remorque || ''), 193, 59.4, 91, { bold: true });
      lv('Conducteur :', e0.conducteur, 193, 65, 91);
      lv('Tél. conducteur :', e0.telConducteur, 193, 70.6, 91);
    } else {
      const pas = engins.length > 3 ? 4.6 : 5.6;
      engins.slice(0, 4).forEach((e, i) => {
        const yy = 53.6 + i * pas;
        font('bold', 7.8); color(C.ink); T(fit(designationEngin(e), 42), 193, yy);
        font('normal', 7.6); color(C.ink2); T(fit([e.conducteur, e.immat || e.remorque].filter(Boolean).join(' · '), 47), 237, yy);
      });
      if (engins.length > 4) { font('italic', 6.8); color(C.muted); T(`+ ${engins.length - 4} autre(s), voir le tableau`, 193, 73.5); }
    }

    let y = drawTable(79, pageRows, FIRST);

    box(10, y + 2.5, 277, 10.5);
    font('bold', 6.4); color(C.muted); T('OBSERVATIONS :', 13, y + 6.9, { charSpace: .15 });
    font('normal', 8.3); color(C.ink);
    const obs = doc.splitTextToSize(clean(bl.observations || ''), 244).slice(0, 2);
    obs.forEach((l, i) => T(l, 38, y + 6.9 + i * 3.7));

    const by = y + 16;  // ≈ 162
    const bh = 199 - by;
    // Facturation + chantier
    box(10, by, 86, bh);
    sect('Facturation', 13, by + 5.3);
    if (seul) {
      const factItems = [['heure', 'Heure'], ['tonnes', 'Tonnes'], ['m3', 'M³'], ['forfait', 'Forfait'], ['nuit', 'Nuit'], ['continu', 'En continu']];
      factItems.forEach(([id, lab], i) => {
        const on = id === 'nuit' ? f.nuit : id === 'continu' ? f.continu : f.mode === id;
        radio(13 + (i % 3) * 27, by + 11.5 + Math.floor(i / 3) * 5.6, on, lab, 27);
      });
      doc.setDrawColor(...C.line1); doc.setLineWidth(.25); doc.line(13, by + 20.5, 93, by + 20.5);
      lv('Ville chantier :', bl.chantier.ville || bl.chantier.nom, 13, by + 26.5, 80, { bold: true });
      lv('Adresse chantier :', bl.chantier.adresse, 13, by + 32.2, 80);
    } else {
      // plusieurs engins : le chantier passe au-dessus du trait, la liste des
      // facturations prend toute la place qui reste en dessous
      lv('Ville chantier :', bl.chantier.ville || bl.chantier.nom, 13, by + 11.5, 80, { bold: true });
      lv('Adresse chantier :', bl.chantier.adresse, 13, by + 17.2, 80);
      doc.setDrawColor(...C.line1); doc.setLineWidth(.25); doc.line(13, by + 20.5, 93, by + 20.5);
      const pasF = engins.length > 3 ? 3.9 : 4.4;
      engins.slice(0, 4).forEach((e, i) => {
        const yy = by + 26 + i * pasF;
        font('bold', 7.4); color(C.ink); T(fit(designationEngin(e), 46), 13, yy);
        font('normal', 7.4); color(C.accentInk);
        T(fit([factLabel(e.facturation.mode), e.facturation.nuit && 'Nuit', e.facturation.continu && 'En continu'].filter(Boolean).join(' · '), 32), 93, yy, { align: 'right' });
      });
      if (engins.length > 4) { font('italic', 6.6); color(C.muted); T(`+ ${engins.length - 4} autre(s)`, 13, by + 26 + 4 * pasF); }
    }

    // Horaires
    box(99, by, 86, bh);
    sect('Horaires', 102, by + 5.3);
    const hrow = (label, a, b, yy) => {
      font('bold', 7.8); color(C.ink2); T(label, 102, yy);
      font('bold', 10); color(a ? C.ink : C.line); T(a || '--:--', 142, yy, { align: 'center' }); color(b ? C.ink : C.line); T(b || '--:--', 168, yy, { align: 'center' });
    };
    if (seul) {
      font('bold', 6.2); color(C.muted); T('ARRIVÉE', 142, by + 10.8, { align: 'center', charSpace: .2 }); T('DÉPART', 168, by + 10.8, { align: 'center', charSpace: .2 });
      if (f.continu) { hrow('Journée continue', h.matinArr, h.matinDep, by + 16.4); }
      else { hrow('Matin', h.matinArr, h.matinDep, by + 16.4); hrow('Après-midi', h.amArr, h.amDep, by + 22); }
    } else {
      const pas = engins.length > 3 ? 6.8 : 8.4;
      engins.slice(0, 4).forEach((e, i) => {
        const yy = by + 12 + i * pas, he = e.horaires;
        font('bold', 7.4); color(C.ink); T(fit(designationEngin(e), 52), 102, yy);
        font('bold', 8.4); color(minutesEngin(e) ? C.accentInk : C.line); T(minutesEngin(e) ? fmtH(minutesEngin(e)) : '—', 182, yy, { align: 'right' });
        font('normal', 7.2); color(C.ink2);
        const t1 = `${he.matinArr || '--:--'} > ${he.matinDep || '--:--'}`;
        T(e.facturation.continu ? `Continu  ${t1}` : `Matin  ${t1}`, 102, yy + 4);
        if (!e.facturation.continu) T(`Après-midi  ${he.amArr || '--:--'} > ${he.amDep || '--:--'}`, 143, yy + 4);
      });
      if (engins.length > 4) { font('italic', 6.6); color(C.muted); T(`+ ${engins.length - 4} autre(s), voir le tableau`, 102, by + 12 + 4 * pas); }
    }
    const mins = minutesTotal(bl);
    if (seul) {
      doc.setDrawColor(...C.line1); doc.line(102, by + 25.5, 182, by + 25.5);
      font('bold', 6.9); color(C.muted); T('TOTAL DU JOUR', 102, by + 31, { charSpace: .3 });
      font('normal', 7.5); color(C.ink2); T(mins ? `soit ${fmtDec(mins)} h` : '', 102, by + 34.6);
      font('bold', 17); color(mins ? C.accent : C.line); T(mins ? fmtH(mins) : '— h —', 182, by + 33.8, { align: 'right' });
    } else {
      // plusieurs engins : le total remonte sur la ligne du titre, la place
      // du bas revenant aux blocs horaires de chaque engin
      font('bold', 6.2); color(C.muted); T('TOTAL DU JOUR', 163, by + 5.3, { align: 'right', charSpace: .2 });
      font('bold', 11.5); color(mins ? C.accent : C.line); T(mins ? fmtH(mins) : '— h —', 183, by + 5.9, { align: 'right' });
    }

    // Signature
    box(188, by, 99, bh);
    sect('Signature chef de chantier', 191, by + 5.3);
    const sx = 191, sy = by + 8, sw = 55, sh = bh - 11;
    doc.setFillColor(...C.s2); doc.setDrawColor(...C.line); doc.setLineDashPattern([.8, .8], 0); doc.roundedRect(sx, sy, sw, sh, 1.2, 1.2, 'FD'); doc.setLineDashPattern([], 0);
    if (bl.signature?.image) {
      const [iw, ih] = await imgSize(bl.signature.image);
      const k = Math.min((sw - 4) / iw, (sh - 4) / ih);
      doc.addImage(bl.signature.image, 'PNG', sx + (sw - iw * k) / 2, sy + (sh - ih * k) / 2, iw * k, ih * k, 'sig', 'FAST');
    } else {
      font('italic', 7.5); color(C.muted); T(apercu ? 'En attente de signature' : 'Non signé', sx + sw / 2, sy + sh / 2 + 1, { align: 'center' });
    }
    const tx = 249;
    lv('Nom :', bl.signature?.nom || bl.chef.nom, tx, by + 12.5, 36, { bold: true });
    lv('Tél. :', bl.signature?.tel || bl.chef.tel, tx, by + 18, 36);
    font('normal', 6.6); color(C.muted);
    const signTxt = bl.signature?.date ? `Signé électroniquement le ${frDateTime(bl.signature.date)}` : 'Signature électronique sur tablette / smartphone';
    doc.splitTextToSize(clean(signTxt), 36).slice(0, 3).forEach((l, i) => T(l, tx, by + 25 + i * 3));

    footer(1, pages);

    /* ---------- pages suivantes ---------- */
    for (let p = 0; p < rest.length; p += PER_PAGE) {
      doc.addPage('a4', 'landscape');
      doc.addImage(lg, 'PNG', 10, 8, 19, 14.9, 'hk-logo', 'FAST');
      font('bold', 13); color(C.ink); T(`${D.titre || 'BON DE LOCATION'} N° ${bl.numero || '—'} — suite`, 33, 15);
      font('normal', 8.5); color(C.ink2); T(`${bl.client.nom} · ${bl.chantier.nom || bl.chantier.ville || ''} · ${frDate(bl.date)}`, 33, 20.5);
      drawTable(28, rest.slice(p, p + PER_PAGE), PER_PAGE);
      footer(2 + p / PER_PAGE, pages);
    }
    return doc;
  };
})();

async function pdfBase64(doc) {
  const buf = new Uint8Array(doc.output('arraybuffer'));
  let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

<script>
/* =============================================================================
   VUES — navigation · planning (Google Agenda) · registre des bons · réglages
   ============================================================================= */
'use strict';

const app = document.getElementById('app');

/* L'app des chauffeurs n'a que deux entrées : le jour et « Nouveau bon ».
   Pas de registre, pas de réglages : ces écrans n'existent pas de ce côté. */
const NAV = CHAUFFEUR
  ? [{ id: 'planning', href: '#/', label: 'Aujourd\'hui', ic: 'home' }]
  : [{ id: 'planning', href: '#/', label: 'Planning', ic: 'calendar' },
     { id: 'bons', href: '#/bons', label: 'Registre', ic: 'list' },
     { id: 'reglages', href: '#/reglages', label: 'Réglages', ic: 'sliders' }];

function renderNav(active) {
  const cur = id => (id === active ? ' aria-current="page"' : '');
  const retour = RETOUR ? `<a class="nav-retour" href="${RETOUR}">${icon('arrowL')}Direction</a>` : '';
  $('#topnav').innerHTML = retour + NAV.map(n => `<a href="${n.href}"${cur(n.id)}>${icon(n.ic)}${n.label}</a>`).join('') +
    `<a class="nav-new" href="#/nouveau">${icon('plus')}Nouveau bon</a>`;
  $('#tabbar').innerHTML = [
    ...(RETOUR ? [`<a href="${RETOUR}">${icon('arrowL')}Direction</a>`] : []),
    ...NAV.map(n => `<a href="${n.href}"${cur(n.id)}>${icon(n.ic)}${n.label}</a>`),
    `<a class="tab-new" href="#/nouveau"><span class="plus">${icon('plus')}</span>Nouveau</a>`,
  ].join('');
}

/* ----------------------------------------------- accueil des chauffeurs --
   Le jour, les interventions prévues, les bons commencés sur ce téléphone.
   Aucune lecture du registre : ce lien est ouvert, il n'a droit qu'à écrire. */
async function viewHomeChauffeur() {
  const today = isoDay(), demain = addDays(today, 1);
  if (state.day !== demain) state.day = today;
  const signes = (LS.get(CLE('signes'), []) || []).filter(b => b.date === today).length;
  app.innerHTML = `
    <section class="hero rise">
      <div>
        <p class="eyebrow">${esc(cap(frLong(today)))}</p>
        <h1 class="display">Bon de location</h1>
        <p class="lead">Remplissez le bon sur le chantier, faites-le signer par le chef de chantier : il part aussitôt en PDF au bureau et au client.</p>
        ${signes ? `<p class="hero-note">${icon('check')}${signes} bon${signes > 1 ? 's' : ''} signé${signes > 1 ? 's' : ''} aujourd'hui depuis ce téléphone</p>` : ''}
      </div>
      <a class="btn btn-accent btn-lg hero-cta" href="#/nouveau">${icon('plus')}Nouveau bon</a>
    </section>
    <div class="home-grid">
      <section class="card planning">
        <header class="card-h">
          <span class="ic">${icon('calendar')}</span>
          <div><h2>Prévu</h2><p id="agenda-src">Planning HK</p></div>
          <div class="card-h-side">
            <div class="seg" role="tablist">
              <button role="tab" data-act="jour" data-day="${today}" aria-selected="${state.day === today}">Aujourd'hui</button>
              <button role="tab" data-act="jour" data-day="${demain}" aria-selected="${state.day === demain}">Demain</button>
            </div>
          </div>
        </header>
        <div class="events" id="events">${skeletonRows(2)}</div>
      </section>
      <aside class="home-side">
        <section class="card">
          <header class="card-h"><span class="ic">${icon('pen')}</span><div><h2>Bons en cours</h2><p>Gardés sur ce téléphone</p></div></header>
          <div class="mini-list" id="drafts"></div>
        </section>
        <section class="card">
          <header class="card-h"><span class="ic">${icon('sparkles')}</span><div><h2>Comment ça marche</h2><p>Trois minutes par bon</p></div></header>
          <ol class="steps-list">
            <li>Choisissez l'intervention prévue, ou « Nouveau bon » si elle n'est pas au planning.</li>
            <li>Véhicule ou engin, trajets, matériaux, puis les heures au quart d'heure.</li>
            <li>Le chef de chantier signe au doigt : le PDF part au bureau et au client.</li>
          </ol>
          <p class="muted" style="margin-top:12px">Astuce : Partager › <b>Sur l'écran d'accueil</b> pour ouvrir l'app en un geste, comme une vraie application.</p>
        </section>
      </aside>
    </div>`;
  renderBrouillons();
  try {
    const { events } = await api('GET', `/agenda?from=${today}&to=${demain}`);
    state.agenda = events;
  } catch (e) {
    state.agenda = [];
    if ($('#agenda-src')) $('#agenda-src').textContent = 'Planning indisponible';
  }
  if ($('#events')) renderEvents();
}

function renderBrouillons() {
  const el = $('#drafts'); if (!el) return;
  const list = brouillonsLocaux();
  el.innerHTML = list.length
    ? list.slice(0, 6).map(bl => `<div class="mini-row">${miniHtml(resumeLocal(bl))}<button class="icon-btn sm danger" data-act="del-draft" data-id="${bl.id}" aria-label="Supprimer ce bon commencé">${icon('trash')}</button></div>`).join('')
    : '<p class="muted" style="padding:6px 2px">Aucun bon commencé. Appuyez sur « Nouveau bon ».</p>';
}

/* ------------------------------------------- accueil direction (planning) -- */
const viewHome = () => (CHAUFFEUR ? viewHomeChauffeur() : viewHomeDirection());

async function viewHomeDirection() {
  const today = isoDay();
  state.day ||= today;
  state.weekStart ||= mondayOf(state.day);
  app.innerHTML = `
    <section class="hero rise">
      <div>
        <p class="eyebrow">${esc(cap(frLong(today)))}</p>
        <h1 class="display">Bons de location</h1>
        <p class="lead">Suivi des interventions et des bons signés par les chauffeurs, avec leurs PDF.</p>
      </div>
      <a class="btn btn-accent btn-lg hero-cta" href="#/nouveau">${icon('plus')}Nouveau bon</a>
    </section>
    <section class="kpis" id="kpis">${kpisHtml(null)}</section>
    <div class="home-grid">
      <section class="card planning">
        <header class="card-h">
          <span class="ic">${icon('calendar')}</span>
          <div><h2>Planning</h2><p id="agenda-src">Google Agenda</p></div>
          <div class="card-h-side">
            <button class="icon-btn sm" data-act="week" data-d="-7" aria-label="Semaine précédente">${icon('chevL')}</button>
            <button class="btn btn-ghost btn-sm" data-act="week-today">Aujourd'hui</button>
            <button class="icon-btn sm" data-act="week" data-d="7" aria-label="Semaine suivante">${icon('chevR')}</button>
          </div>
        </header>
        <div class="week" id="week"></div>
        <div class="events" id="events">${skeletonRows(3)}</div>
      </section>
      <aside class="home-side">
        <section class="card"><header class="card-h"><span class="ic">${icon('pen')}</span><div><h2>À signer</h2><p>Brouillons en cours</p></div></header><div class="mini-list" id="drafts">${skeletonRows(2)}</div></section>
        <section class="card"><header class="card-h"><span class="ic">${icon('file')}</span><div><h2>Derniers bons</h2><p>Signés et rangés au registre</p></div><a class="link" href="#/bons">Tout voir</a></header><div class="mini-list" id="recent">${skeletonRows(3)}</div></section>
      </aside>
    </div>`;
  renderWeek({});
  loadHome();
}

function kpisHtml(bons) {
  if (!bons) return '<div class="kpi sk" style="height:96px"></div>'.repeat(3);
  const today = isoDay(), from = addDays(today, -6);
  const signes = bons.filter(b => b.statut !== 'brouillon');
  const jour = signes.filter(b => b.date === today).length;
  const mins = signes.filter(b => b.date >= from && b.date <= today).reduce((s, b) => s + b.minutes, 0);
  const drafts = bons.filter(b => b.statut === 'brouillon').length;
  return `<div class="kpi"><p class="k-label">Bons signés aujourd'hui</p><p class="k-val">${jour}</p></div>
    <div class="kpi dark"><p class="k-label">Heures signées · 7 jours</p><p class="k-val">${Math.floor(mins / 60)}<small>h${pad2(mins % 60)}</small></p></div>
    <div class="kpi"><p class="k-label">Bons à signer</p><p class="k-val">${drafts}</p></div>`;
}

function renderWeek(counts) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(state.weekStart, i));
  const today = isoDay();
  $('#week').innerHTML = days.map(d => {
    const dt = parseDay(d);
    return `<button class="day${d === today ? ' today' : ''}${counts[d] ? ' has' : ''}" data-act="day" data-day="${d}" aria-pressed="${d === state.day}" aria-label="${esc(frLong(d))}${counts[d] ? `, ${counts[d]} intervention(s)` : ''}">
      <span class="d-name">${JOURS[dt.getDay()].slice(0, 3)}</span><span class="d-num">${dt.getDate()}</span><span class="d-dot"></span></button>`;
  }).join('');
}

async function loadHome() {
  const from = state.weekStart, to = addDays(state.weekStart, 6);
  const [bonsR, agR] = await Promise.allSettled([api('GET', '/bons'), api('GET', `/agenda?from=${from}&to=${to}`)]);
  if (!document.getElementById('events')) return;
  if (bonsR.status === 'fulfilled') {
    state.bons = bonsR.value.bons;
    $('#kpis').innerHTML = kpisHtml(state.bons);
    const drafts = state.bons.filter(b => b.statut === 'brouillon').slice(0, 5);
    $('#drafts').innerHTML = drafts.length ? drafts.map(miniHtml).join('') : '<p class="muted" style="padding:6px 2px">Aucun brouillon en attente.</p>';
    const recent = state.bons.filter(b => b.statut !== 'brouillon').sort((a, b) => (b.signeLe || '').localeCompare(a.signeLe || '')).slice(0, 5);
    $('#recent').innerHTML = recent.length ? recent.map(miniHtml).join('') : '<p class="muted" style="padding:6px 2px">Les bons signés apparaîtront ici.</p>';
  } else {
    $('#kpis').innerHTML = `<div class="note note-warn" style="grid-column:1/-1">${icon('alert')}Connexion au service impossible pour le moment. Réessayez dans un instant.</div>`;
  }
  if (agR.status === 'fulfilled') {
    state.agenda = agR.value.events;
    $('#agenda-src').textContent = agR.value.source === 'google' ? 'Google Agenda synchronisé' : 'Agenda de démonstration';
    const counts = {}; state.agenda.forEach(e => { counts[e.date] = (counts[e.date] || 0) + 1; });
    renderWeek(counts);
    renderEvents();
  } else {
    $('#events').innerHTML = `<div class="note note-warn">${icon('alert')}${esc(agR.reason?.message || 'Agenda indisponible')}</div>`;
  }
}

function renderEvents() {
  const list = (state.agenda || []).filter(e => e.date === state.day);
  const head = `<p class="day-title">${icon('calendar')}${esc(cap(frLong(state.day)))}<span class="count">${list.length} intervention${list.length > 1 ? 's' : ''}</span></p>`;
  $('#events').innerHTML = head + (list.length ? list.map((ev, i) => eventHtml(ev, i)).join('')
    : emptyState('Rien de prévu ce jour', 'Aucun événement dans l\'agenda. Vous pouvez créer un bon vierge.', 'autre', '<a class="btn btn-ghost btn-sm" href="#/nouveau">Créer un bon vierge</a>'));
}

function eventHtml(ev, i) {
  const p = fromAgenda(ev), e0 = p.engins?.[0];
  const m = matById(e0?.type);
  const lieu = [p.chantier?.nom, p.chantier?.ville].filter(Boolean).join(' · ') || ev.lieu;
  const bon = ev.bon;
  // Un bon signé n'est plus sur le téléphone du chauffeur : on l'annonce sans lien.
  const act = !bon
    ? `<a class="btn btn-dark btn-sm" href="#/nouveau?uid=${encodeURIComponent(ev.uid)}&date=${ev.date}">Préparer le bon${icon('arrowR')}</a>`
    : bon.statut === 'brouillon'
      ? `${statusBadge(bon)}<a class="btn btn-ghost btn-sm" href="#/bl/${bon.id}/chantier">Reprendre le bon${icon('arrowR')}</a>`
      : CHAUFFEUR
        ? `${statusBadge(bon)}<span class="ev-fait">${icon('check')}Bon N° ${esc(bon.numero)} fait</span>`
        : `${statusBadge(bon)}<a class="btn btn-ghost btn-sm" href="#/bl/${bon.id}/ok">Bon N° ${esc(bon.numero)}${icon('arrowR')}</a>`;
  return `<article class="event" style="animation-delay:${i * 40}ms">
    <div class="ev-time"><b>${ev.journee ? 'Jour' : esc(ev.debut)}</b>${ev.fin ? `<span>${esc(ev.fin)}</span>` : ''}</div>
    <div class="ev-body">
      <div class="ev-tags">${m ? `<span class="tag tag-accent">${ill(m)}${esc(m.label)}</span>` : ''}${e0?.facturation?.mode && m ? `<span class="tag">${esc(factLabel(e0.facturation.mode))}</span>` : ''}</div>
      <h3>${esc(p.client?.nom || ev.titre)}</h3>
      ${lieu ? `<p class="ev-meta">${icon('pin')}<span>${esc(lieu)}</span></p>` : ''}
      ${p.chef?.nom ? `<p class="ev-meta">${icon('user')}<span>${esc(p.chef.nom)}${p.chantier?.numero ? ` · ${esc(p.chantier.numero)}` : ''}</span></p>` : ''}
    </div>
    <div class="ev-act">${act}</div>
  </article>`;
}

function miniHtml(b) {
  const m = matById(b.materiel);
  const href = `#/bl/${b.id}/${b.statut === 'brouillon' ? 'chantier' : 'ok'}`;
  return `<a class="mini" href="${href}">
    <span class="m-ill">${ill(m || { ill: 'autre' })}</span>
    <span class="m-body"><span class="m-t">${esc(b.client || 'Client à renseigner')}</span><span class="m-s">${b.numero ? `N° ${esc(b.numero)} · ` : ''}${esc(frDate(b.date))}${b.chantier ? ` · ${esc(b.chantier)}` : ''}</span></span>
    <span class="m-r">${b.minutes ? `<b>${fmtH(b.minutes)}</b>` : ''}${statusBadge(b)}</span>
  </a>`;
}

/* -------------------------------------------------------------- registre -- */
async function viewRegistre() {
  app.innerHTML = `
    <section class="page-h rise">
      <div><p class="eyebrow">Registre</p><h1 class="display">Tous les bons</h1><p class="lead" id="reg-count">Chaque bon signé arrive ici avec son PDF.</p></div>
      <div class="page-h-act"><button type="button" class="btn btn-ghost" data-act="export-csv">${icon('download')}Exporter le tableau</button><a class="btn btn-accent" href="#/nouveau">${icon('plus')}Nouveau bon</a></div>
    </section>
    <div class="toolbar">
      <label class="search field">${icon('search')}<input type="search" id="reg-q" value="${esc(state.regQuery)}" placeholder="Client, chantier, N°, immatriculation…" aria-label="Rechercher un bon"></label>
      <div class="seg" role="tablist" id="reg-filter">
        ${[['tous', 'Tous'], ['brouillon', 'À signer'], ['signe', 'Signés']].map(([id, l]) => `<button role="tab" data-act="reg-filter" data-f="${id}" aria-selected="${state.regFilter === id}">${l}<span class="count" data-count="${id}"></span></button>`).join('')}
      </div>
    </div>
    <section class="card table-card rise" id="reg-list">${skeletonRows(4)}</section>`;
  $('#reg-q').addEventListener('input', e => { state.regQuery = e.target.value; renderRegistre(); });
  try { state.bons = (await api('GET', '/bons')).bons; renderRegistre(); }
  catch (e) { $('#reg-list').innerHTML = `<div class="note note-warn" style="margin:16px">${icon('alert')}${esc(e.message)}</div>`; }
}

function renderRegistre() {
  const all = state.bons || [];
  const q = norm(state.regQuery);
  const counts = { tous: all.length, brouillon: all.filter(b => b.statut === 'brouillon').length, signe: all.filter(b => b.statut !== 'brouillon').length };
  $$('[data-count]').forEach(c => { c.textContent = counts[c.dataset.count]; });
  const list = all.filter(b => state.regFilter === 'tous' || (state.regFilter === 'brouillon' ? b.statut === 'brouillon' : b.statut !== 'brouillon'))
    .filter(b => !q || norm([b.numero, b.client, b.chantier, b.numChantier, b.commande, b.chef, b.immat, b.conducteur, matById(b.materiel)?.label, b.materielLibre].join(' ')).includes(q));
  $('#reg-count').textContent = `${counts.signe} bon${counts.signe > 1 ? 's' : ''} signé${counts.signe > 1 ? 's' : ''} · ${counts.brouillon} à signer`;
  if (!list.length) {
    $('#reg-list').innerHTML = emptyState(all.length ? 'Aucun résultat' : 'Aucun bon pour le moment', all.length ? 'Essayez une autre recherche.' : 'Créez votre premier bon depuis le planning.', 'semi', all.length ? '' : '<a class="btn btn-dark btn-sm" href="#/nouveau">Nouveau bon</a>');
    return;
  }
  const actions = (b, big) => b.statut === 'brouillon'
    ? `<a class="btn btn-dark btn-sm" href="#/bl/${b.id}/chantier">Reprendre</a><button class="icon-btn sm danger" data-act="del-draft" data-id="${b.id}" aria-label="Supprimer le brouillon">${icon('trash')}</button>`
    : `${b.pdf ? `<button class="${big ? 'btn btn-ghost btn-sm' : 'icon-btn sm'}" data-act="pdf" data-url="${b.pdf.url}" data-title="Bon N° ${esc(b.numero)}" aria-label="Voir le PDF">${icon('eye')}${big ? 'PDF' : ''}</button>
       ${big ? `<button type="button" class="icon-btn sm" data-act="pdf-dl" data-url="${b.pdf.url}" data-name="BL-${esc(b.numero)}.pdf" aria-label="Télécharger le PDF">${icon('download')}</button>` : ''}` : ''}
       <a class="icon-btn sm" href="#/bl/${b.id}/ok" aria-label="Détail et envoi du mail" title="${esc(mailLabel(b.mail))}">${icon('mail')}</a>
       <a class="icon-btn sm" href="#/nouveau?dupliquer=${b.id}" aria-label="Dupliquer ce bon">${icon('copy')}</a>`;
  // « +2 » quand le bon porte plusieurs engins (le détail est dans le PDF)
  const enPlus = b => Math.max(0, String(b.designation || '').split(' + ').filter(Boolean).length - 1);
  const matCell = b => { const m = matById(b.materiel), n = enPlus(b); return m ? `<div class="t-mat">${ill(m)}<div><div class="t-strong">${esc(m.cat === 'autre' ? (b.materielLibre || 'Autre') : m.label)}${n ? `<span class="t-plus" title="${esc(b.designation)}">+${n}</span>` : ''}</div><div class="t-sub">${esc(b.immat || b.conducteur || '')}</div></div></div>` : '<span class="muted">—</span>'; };
  $('#reg-list').innerHTML = `
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>N°</th><th>Date</th><th>Client · chantier</th><th>Matériel</th><th>Heures</th><th>Chef de chantier</th><th>Statut</th><th class="sr-only">Actions</th></tr></thead>
      <tbody>${list.map(b => `<tr>
        <td class="t-num">${b.numero ? esc(b.numero) : '<span class="muted">—</span>'}</td>
        <td>${esc(frDate(b.date))}</td>
        <td><div class="t-strong">${esc(b.client || '—')}</div><div class="t-sub">${esc([b.chantier, b.numChantier].filter(Boolean).join(' · '))}</div></td>
        <td>${matCell(b)}</td>
        <td class="t-h">${b.minutes ? fmtH(b.minutes) : '<span class="muted">—</span>'}</td>
        <td><div class="t-strong">${esc(b.chef || '—')}</div><div class="t-sub">${esc(b.chefEmail)}</div></td>
        <td>${statusBadge(b)}</td>
        <td><div class="t-act">${actions(b, false)}</div></td></tr>`).join('')}</tbody>
    </table></div>
    <div class="reg-cards">${list.map(b => `<article class="rcard">
      <div class="rc-top"><span class="t-num">${b.numero ? `N° ${esc(b.numero)}` : 'Brouillon'}</span><span class="muted">${esc(frDate(b.date))}</span>${statusBadge(b)}</div>
      <div><p class="rc-t">${esc(b.client || 'Client à renseigner')}</p><p class="rc-s">${esc([b.designation || matById(b.materiel)?.label, b.chantier].filter(Boolean).join(' · '))}</p></div>
      <div class="rc-h">${b.minutes ? fmtH(b.minutes) : ''}</div>
      <div class="rc-act">${actions(b, true)}</div></article>`).join('')}</div>`;
}

/* -------------------------------------------------------------- réglages --
   Écran vu par la direction de HK : ce qu'ils ont besoin de savoir, et rien
   sur la machinerie qui est derrière (hébergement, base, automatisations).
   Le détail technique reste dans MISE-EN-LIGNE.txt, côté agence.            */
async function viewReglages() {
  const cfg = state.config || await api('GET', '/config').catch(() => null);

  const enLigne = MODE === 'supabase', envoiAuto = cfg?.mail?.mode === 'make';

  const mail = enLigne
    ? `<p><span class="status-dot${envoiAuto ? ' on' : ''}">${envoiAuto ? 'Envoi automatique actif' : 'Envoi automatique en préparation'}</span></p>
       <p class="muted" style="margin-top:8px">${envoiAuto
