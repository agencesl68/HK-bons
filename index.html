       </ol>`
    : `<p style="margin-bottom:12px"><span class="status-dot${cfg?.agenda?.source === 'google' ? ' on' : ''}">${cfg?.agenda?.source === 'google' ? 'Agenda connecté' : 'Agenda de démonstration'}</span></p>
       <ol class="steps-list">
         <li>Écrire la description de l'événement avec le modèle ci-contre : chaque ligne remplit un champ du bon.</li>
         <li>Sur le chantier, « Préparer le bon » ouvre un bon déjà rempli.</li>
       </ol>`;

  app.innerHTML = `
    <section class="page-h rise"><div><p class="eyebrow">Réglages</p><h1 class="display">Informations</h1><p class="lead">L'en-tête des bons et la façon dont ils partent au chef de chantier.</p></div></section>
    <div class="set-grid">
      <section class="card">
        <header class="card-h"><span class="ic">${icon('building')}</span><div><h2>Entreprise</h2><p>En-tête du bon de location</p></div></header>
        <dl class="kv"><dt>Raison sociale</dt><dd>${esc(E.nom)}</dd><dt>Adresse</dt><dd>${esc(E.adresse)}, ${esc(E.cpVille)}</dd><dt>Téléphone</dt><dd>${esc(E.tel)}</dd><dt>Email</dt><dd>${esc(E.email)}</dd><dt>Prochain N° de bon</dt><dd class="num" style="font-size:20px;color:var(--accent-ink)">${esc(cfg?.prochainNumero || '')}</dd></dl>
        <p class="muted" style="margin-top:12px">Pour modifier ces informations, contactez SL Agence.</p>
      </section>
      <section class="card">
        <header class="card-h"><span class="ic">${icon('mail')}</span><div><h2>Envoi au chef de chantier</h2><p>PDF signé joint au mail</p></div></header>
        ${mail}
      </section>
      <section class="card">
        <header class="card-h"><span class="ic">${icon('calendar')}</span><div><h2>Planning</h2><p>Les bons se préremplissent depuis l'agenda</p></div></header>
        ${agenda}
      </section>
      <section class="card">
        <header class="card-h"><span class="ic">${icon('note')}</span><div><h2>Modèle d'événement</h2><p>À recopier dans l'agenda</p></div></header>
        <pre class="code" id="tpl">${tpl}</pre>
        <div class="row" style="margin-top:14px"><button class="btn btn-ghost btn-sm" data-act="copy-tpl">${icon('copy')}Copier le modèle</button><a class="btn btn-dark btn-sm" href="${gcalLink(null)}" target="_blank" rel="noopener">${icon('external')}Créer un événement modèle</a></div>
      </section>
    </div>
    ${enLigne && !AUTO ? `<div class="row" style="margin:22px 2px 0"><button type="button" class="btn btn-ghost btn-sm" data-act="deconnexion">${icon('arrowL')}Se déconnecter</button></div>` : ''}`;
}

</script>
<script>
/* =============================================================================
   ASSISTANT (1/2) — structure, aperçu live, étapes Chantier · Matériel · Prestation
   ============================================================================= */
'use strict';

const factLine = e => [factLabel(e?.facturation?.mode), e?.facturation?.nuit && 'Nuit', e?.facturation?.continu && 'En continu'].filter(Boolean).join(' · ');
const stepIndex = key => Math.max(0, STEPS.findIndex(s => s.key === key));

function viewWizard(stepKey) {
  const bl = state.bl;
  state.step = STEPS[stepIndex(stepKey)].key;
  app.innerHTML = `
    <div class="wz-head rise">
      <a class="icon-btn" href="#/" aria-label="Quitter (le brouillon est conservé)">${icon('arrowL')}</a>
      <div class="wz-title"><p class="eyebrow">${bl.source?.agendaUid ? 'Prérempli depuis Google Agenda' : 'Nouveau bon'}</p><h1>Bon de location <span>${bl.numero ? `N° ${esc(bl.numero)}` : ''}</span></h1></div>
      <span class="save-state" id="save-state" data-s="saved" role="status">Enregistré</span>
    </div>
    <ol class="stepper" id="stepper"></ol>
    <div class="step-mini" id="step-mini" aria-hidden="true"></div>
    <div class="wz-grid">
      <section class="wz-main" id="step"></section>
      <aside class="wz-aside" id="live" aria-label="Aperçu du bon"></aside>
    </div>
    <div class="actionbar"><div class="actionbar-in" id="actionbar"></div></div>
    ${datalists()}`;
  renderStep();
}

function renderStep({ keepScroll = false } = {}) {
  const bl = state.bl, key = state.step, idx = stepIndex(key);
  const y = window.scrollY;
  const step = $('#step');
  state.pad?.destroy?.(); state.pad = null;
  step.innerHTML = STEP_VIEWS[key](bl);
  if (!keepScroll) { step.classList.remove('wz-main'); void step.offsetWidth; step.classList.add('wz-main'); }
  $('#stepper').innerHTML = STEPS.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'current' : ''}">
    <button type="button" data-act="goto" data-step="${s.key}"${i === idx ? ' aria-current="step"' : ''}><span class="bar"></span><span class="s-lab"><span class="s-n">${i + 1}</span><span class="s-t">${s.label}</span></span></button></li>`).join('');
  $('#step-mini').innerHTML = `<div class="sm-top"><span>Étape ${idx + 1} sur ${STEPS.length}</span><b>${STEPS[idx].label}</b></div>
    <div class="sm-bar">${STEPS.map((s, i) => `<i class="${i < idx ? 'done' : i === idx ? 'current' : ''}"></i>`).join('')}</div>`;
  const nextLabel = { chantier: 'Matériel', materiel: 'Prestation', prestation: 'Heures', heures: 'Récapitulatif', recap: 'Faire signer le chef' }[key];
  $('#actionbar').innerHTML = `
    ${idx > 0 ? `<button type="button" class="btn btn-ghost" data-act="prev" aria-label="Étape précédente">${icon('arrowL')}<span class="hide-xs">Retour</span></button>` : '<a class="btn btn-ghost" href="#/">Plus tard</a>'}
    <div class="ab-info">Total du jour<b>${fmtH(minutesTotal(bl))}</b></div>
    ${key === 'signature'
      ? `<button type="button" class="btn btn-accent btn-next" data-act="sign">${icon('pen')}Signer et envoyer</button>`
      : `<button type="button" class="btn btn-dark btn-next" data-act="next">${nextLabel}${icon('arrowR')}</button>`}`;
  renderLive();
  if (key === 'signature') mountSignature();
  if (keepScroll) window.scrollTo(0, y);
  if (state.focus) { const el = document.getElementById(state.focus); state.focus = null; el?.focus({ preventScroll: false }); }
  if (key === 'chantier') majCarte({ aussitot: true });
}

function datalists() {
  const uniq = arr => [...new Set(arr.filter(Boolean))].slice(0, 40);
  const bons = state.bons || [];
  const opt = arr => arr.map(v => `<option value="${esc(v)}">`).join('');
  return `<datalist id="dl-clients">${opt(uniq(bons.map(b => b.client)))}</datalist>
    <datalist id="dl-chefs">${opt(uniq(bons.map(b => b.chef)))}</datalist>
    <datalist id="dl-conducteurs">${opt(uniq(bons.map(b => b.conducteur)))}</datalist>
    <datalist id="dl-lieux">${opt(uniq(['Dépôt HK Ueberstrass', ...LS.get(CLE('lieux'), [])]))}</datalist>`;
}

function renderLive() {
  const el = $('#live'); if (!el) return;
  const bl = state.bl, engins = enginsRemplis(bl), mins = minutesTotal(bl);
  const ok = s => !validate(bl, s).errors.length;
  const checks = [['Chantier', ok('chantier')], ['Engins', !!engins.length && ok('materiel')], ['Prestation', !!engins.length && ok('prestation')], ['Heures', ok('heures')], ['Récap', stepIndex(state.step) >= 4], ['Signature', !!(state.pad && !state.pad.isEmpty())]];
  const ligne = e => `<div class="l-eng">${ill(matById(e.type))}<div><b>${esc(designationEngin(e))}</b><span>${esc([e.conducteur, factLine(e)].filter(Boolean).join(' · '))}</span></div><em>${minutesEngin(e) ? fmtH(minutesEngin(e)) : '—'}</em></div>`;
  el.innerHTML = `<div class="live">
    <div class="l-top"><span class="eyebrow">Aperçu du bon</span><span class="l-num">${bl.numero ? `N° ${esc(bl.numero)}` : 'N° à la signature'}</span></div>
    <p class="l-client">${esc(bl.client.nom || 'Client à renseigner')}</p>
    <p class="l-sub">${esc([bl.chantier.nom, bl.chantier.ville].filter(Boolean).join(' · ') || 'Chantier')} · ${esc(frDate(bl.date))}</p>
    ${engins.length ? `<div class="l-engins">${engins.map(ligne).join('')}</div>` : ''}
    <div class="l-rows">
      <div class="l-row"><span>Chef de chantier</span><b>${esc(bl.chef.nom || '—')}</b></div>
      ${totalTours(bl) ? `<div class="l-row"><span>Trajets</span><b>${totalTours(bl)} tour(s)</b></div>` : ''}
      ${totalMateriaux(bl) ? `<div class="l-row"><span>Matériaux</span><b>${fmtNum(totalMateriaux(bl))} ${unitMat(engins[0])}</b></div>` : ''}
    </div>
    <div class="l-total"><span>Total du jour</span><b>${fmtH(mins)}</b></div>
    <div class="l-checks">${checks.map(([l, v]) => `<span class="l-check${v ? ' ok' : ''}">${icon(v ? 'check' : 'clock')}${l}</span>`).join('')}</div>
  </div>`;
}

function refreshLive() {
  const bl = state.bl; if (!bl) return;
  renderLive();
  const set = (k, v) => { const el = $(`[data-live="${k}"]`); if (el) el.textContent = v; };
  bl.engins.forEach((e, i) => {
    const t = toursEngin(e), u = unitMat(e);
    set(`tours-${i}`, `${t} tour${t > 1 ? 's' : ''}`);
    set(`mat-total-${i}`, `${fmtNum(materiauxEngin(e))} ${u}`);
    e.materiaux.forEach((mt, k) => set(`mat-${i}-${k}`, `${fmtNum(mt.pesees.reduce((a, p) => a + num(p.poids), 0))} ${u}`));
  });
  const ab = $('.ab-info b'); if (ab) ab.textContent = fmtH(minutesTotal(bl));
}

const cardHead = (ic, title, sub, side = '') => `<header class="card-h"><span class="ic">${icon(ic)}</span><div><h2>${title}</h2><p>${sub}</p></div>${side}</header>`;

/* -------------------------------------------------------------- chantier -- */
function stepChantier(bl) {
  return `
  <div class="card">
    ${cardHead('building', 'Chantier', 'Client, numéros de chantier et de commande')}
    ${bl.source?.agendaUid ? `<div class="note note-accent">${icon('sparkles')}<span>Prérempli depuis l'agenda : <b>${esc(bl.source.titre)}</b>. Vérifiez et complétez.</span></div>` : ''}
    <div class="grid g-2">
      ${field({ label: 'Date du bon', bind: 'date', type: 'date', req: true })}
      ${field({ label: 'Client', bind: 'client.nom', req: true, cap: 'words', ph: 'Nom du client / donneur d\'ordre', list: 'dl-clients', ac: 'organization' })}
    </div>
    <div class="grid" style="margin-top:14px">${field({ label: 'Adresse du client', bind: 'client.adresse', ph: 'Rue, code postal, ville' })}</div>
    <div class="sep"></div>
    <div class="grid g-2">
      ${field({ label: 'N° de chantier', bind: 'chantier.numero', cap: 'code', ic: 'hash', ph: 'CH-2026-…' })}
      ${field({ label: 'N° de commande', bind: 'chantier.commande', cap: 'code', ic: 'hash', ph: 'Bon de commande client' })}
      ${field({ label: 'Nom du chantier', bind: 'chantier.nom', ph: 'Ex. Lotissement Les Vergers' })}
      ${field({ label: 'Ville du chantier', bind: 'chantier.ville', cap: 'words', ic: 'pin', ph: 'Ville' })}
    </div>
    <div class="grid" style="margin-top:14px">${field({ label: 'Adresse du chantier', bind: 'chantier.adresse', ph: 'Rue, lieu-dit…' })}</div>
    <div id="carte-chantier"></div>
  </div>
  <div class="card">
    ${cardHead('user', 'Chef de chantier', 'Il relit le récapitulatif, signe et reçoit le PDF')}
    <div class="grid g-2">
      ${field({ label: 'Nom du chef de chantier', bind: 'chef.nom', req: true, cap: 'words', ic: 'user', list: 'dl-chefs', ac: 'name' })}
      ${field({ label: 'Téléphone', bind: 'chef.tel', type: 'tel', im: 'tel', ic: 'phone', ph: '06 …' })}
    </div>
    <div class="grid" style="margin-top:14px">${field({ label: 'Email du chef de chantier', bind: 'chef.email', type: 'email', im: 'email', ic: 'mail', ph: 'prenom.nom@entreprise.fr', help: 'Le bon signé lui sera envoyé en PDF.' })}</div>
  </div>`;
}

/* -------------------------------------------------------------- matériel --
   Un bon peut porter plusieurs engins : une pelle et un camion sur le même
   chantier n'ont ni le même conducteur ni les mêmes heures. Chaque engin a
   donc sa carte, avec son identification et sa facturation.               */
function stepMateriel(bl) {
  return bl.engins.map((e, i) => enginCard(bl, e, i)).join('') + `
  <button type="button" class="btn-dashed" data-act="add-engin">${icon('plus')}Ajouter un engin</button>`;
}

const titreEngin = (bl, i) => (bl.engins.length > 1 ? `Engin ${i + 1} sur ${bl.engins.length}` : 'Matériel');

function enginCard(bl, e, i) {
  const m = matById(e.type), cat = m?.cat, plusieurs = bl.engins.length > 1;
  const retirer = plusieurs ? `<div class="card-h-side"><button type="button" class="icon-btn sm danger" data-act="del-engin" data-i="${i}" aria-label="Retirer cet engin">${icon('trash')}</button></div>` : '';
  if (!m) {
    const tab = state.matTab || 'camion';
    const items = MATERIEL.filter(x => x.cat === tab);
    const metaOf = x => ({ camion: x.remorque ? 'Trajets · pesées · remorque' : 'Trajets · pesées', pelle: 'Facturée à l\'heure', transfert: 'À l\'heure ou au forfait', autre: 'Désignation à la main' }[x.cat]);
    return `<div class="card">
      ${cardHead('truck', titreEngin(bl, i), 'Véhicule ou engin de ce bon', retirer)}
      <div class="seg tabs-wrap" role="tablist" aria-label="Catégorie de matériel">
        ${CATS.map(c => `<button type="button" role="tab" data-act="mat-tab" data-tab="${c.id}" aria-selected="${c.id === tab}">${c.label}</button>`).join('')}
      </div>
      <div class="vgrid" data-err-anchor="engins.${i}.type">
        ${items.map((x, k) => `<button type="button" class="vcard" data-act="pick-mat" data-id="${x.id}" data-i="${i}" aria-pressed="false" style="animation-delay:${k * 30}ms">
          <span class="v-check">${icon('check')}</span><span class="v-ill">${ill(x)}</span><span class="v-label">${esc(x.label)}</span><span class="v-meta">${metaOf(x)}</span></button>`).join('')}
      </div>
    </div>`;
  }
  const allowed = FACT_BY_CAT[cat];
  return `<div class="card">
    ${cardHead('truck', titreEngin(bl, i), 'Véhicule ou engin, conducteur et facturation', retirer)}
    <div class="engin-choisi">
      <span class="ec-ill">${ill(m)}</span>
      <div class="ec-txt"><b>${esc(m.label)}</b><span>${esc(CATS.find(c => c.id === cat)?.meta || '')}</span></div>
      <button type="button" class="btn btn-ghost btn-sm" data-act="change-engin" data-i="${i}">${icon('refresh')}Changer</button>
    </div>
    ${cat === 'autre' ? `<div class="grid" style="margin-top:14px">${field({ label: 'Désignation', bind: `engins.${i}.libreDesignation`, req: true, ph: 'Ex. Chargeuse, compacteur, nacelle…' })}</div>` : ''}
    ${cat === 'transfert' ? `<div class="grid" style="margin-top:14px">${field({ label: 'Engin transféré', bind: `engins.${i}.libreDesignation`, ph: 'Ex. Pelle 25T', help: 'Départ et arrivée se notent à l\'étape Prestation.' })}</div>` : ''}
    <div class="sep"></div>
    <div class="grid g-2">
      ${field({ label: cat === 'pelle' ? 'N° d\'engin / immat (option)' : 'N° immatriculation', bind: `engins.${i}.immat`, req: cat === 'camion', cap: 'code', ph: 'AB-123-CD', ac: 'off' })}
      ${m.remorque || e.remorque ? field({ label: 'N° de remorque', bind: `engins.${i}.remorque`, cap: 'code', ph: 'N° ou immat remorque' }) : '<div></div>'}
      ${field({ label: 'Conducteur', bind: `engins.${i}.conducteur`, req: true, cap: 'words', ic: 'user', list: 'dl-conducteurs' })}
      ${field({ label: 'Tél. conducteur', bind: `engins.${i}.telConducteur`, type: 'tel', im: 'tel', ic: 'phone' })}
    </div>
    <div class="sep"></div>
    <p class="label" style="margin-bottom:8px">Type de facturation</p>
    <div class="radios" role="radiogroup" aria-label="Type de facturation">
      ${FACT.map(x => { const lock = !allowed.includes(x.id); return `<label class="radio${lock ? ' locked' : ''}"><input type="radio" name="fact-${i}" value="${x.id}" data-bind-radio="engins.${i}.facturation.mode"${e.facturation.mode === x.id ? ' checked' : ''}${lock ? ' disabled' : ''}><span class="dot"></span>${x.label}</label>`; }).join('')}
    </div>
    ${cat === 'pelle' ? `<div class="note note-info" style="margin-top:12px">${icon('lock')}<span>Toutes les pelles sont facturées à l'heure.</span></div>` : ''}
    <div class="toggles">
      <label class="switch"><input type="checkbox" data-bind-bool="engins.${i}.facturation.nuit"${e.facturation.nuit ? ' checked' : ''}><span class="track"></span><span>Nuit</span></label>
      <label class="switch"><input type="checkbox" data-bind-bool="engins.${i}.facturation.continu" data-rerender${e.facturation.continu ? ' checked' : ''}><span class="track"></span><span>En continu<small>Journée sans coupure</small></span></label>
    </div>
  </div>`;
}

/* ------------------------------------------------------------ prestation -- */
function stepPrestation(bl) {
  const engins = enginsRemplis(bl);
  if (!engins.length) return `<div class="card">${emptyState('Choisissez d\'abord le matériel', 'Les champs de la prestation dépendent du véhicule ou de l\'engin.', 'semi', '<button type="button" class="btn btn-dark btn-sm" data-act="goto" data-step="materiel">Choisir le matériel</button>')}</div>`;
  let html = '';
  for (const e of engins) {
    const i = bl.engins.indexOf(e), cat = catOf(e), m = matById(e.type);
    if (engins.length > 1) html += `<p class="engin-sep">${ill(m)}${esc(designationEngin(e))}${e.conducteur ? `<span>${esc(e.conducteur)}</span>` : ''}</p>`;
    if (cat === 'pelle') {
      html += `<div class="card">${cardHead('file', 'Bon simple', 'Location à l\'heure')}
        <div class="row" style="gap:20px;flex-wrap:nowrap"><div style="width:130px;flex:none;color:var(--accent-ink)">${ill(m)}</div>
        <div><p style="font-weight:800;font-size:21px;line-height:1.2">${esc(designationEngin(e))}</p><p class="muted" style="margin-top:4px">Rien d'autre à saisir ici : notez les heures à l'étape suivante. Ajoutez une ligne plus bas si besoin.</p></div></div></div>`;
    }
    if (cat === 'camion' || cat === 'transfert') html += trajetsCard(e, i, cat);
    if (cat === 'camion') html += materiauxCard(e, i);
  }
  html += lignesCard(bl);
  html += `<div class="card">${cardHead('note', 'Observations', 'Remarques visibles sur le bon')}
    <div class="field" data-field="observations"><label for="f-observations" class="sr-only">Observations</label><textarea id="f-observations" data-bind="observations" placeholder="Accès difficile, attente, casse, consignes…">${esc(bl.observations)}</textarea></div></div>`;
  return html;
}

function trajetsCard(e, i, cat) {
  const t = toursEngin(e);
  const rows = e.trajets.map((tj, j) => `
    <div class="trajet">
      <div class="tj-idx">${j + 1}</div>
      <div class="tj-route">
        <div class="tj-pt"><span class="dot dot-a"></span>${field({ label: 'Départ · lieu de chargement', bind: `engins.${i}.trajets.${j}.depart`, ph: 'Carrière, dépôt, chantier…', list: 'dl-lieux' })}</div>
        <div class="tj-pt"><span class="dot dot-b"></span>${field({ label: 'Arrivée · lieu de déchargement', bind: `engins.${i}.trajets.${j}.arrivee`, ph: 'Chantier, centre de tri…', list: 'dl-lieux' })}</div>
      </div>
      <div class="tj-side">
        <span class="label">Tours</span>
        <div class="numstep"><button type="button" data-act="tour" data-i="${i}" data-j="${j}" data-d="-1" aria-label="Retirer un tour">${icon('minus')}</button><input type="text" inputmode="numeric" data-bind="engins.${i}.trajets.${j}.tours" data-int value="${esc(tj.tours)}" aria-label="Nombre de tours du trajet ${j + 1}"><button type="button" data-act="tour" data-i="${i}" data-j="${j}" data-d="1" aria-label="Ajouter un tour">${icon('plus')}</button></div>
        <div class="tj-tools">
          <button type="button" class="icon-btn sm" data-act="retour" data-i="${i}" data-j="${j}" aria-label="Ajouter le trajet retour" title="Ajouter le retour">${icon('swap')}</button>
          <button type="button" class="icon-btn sm danger" data-act="del-trajet" data-i="${i}" data-j="${j}" aria-label="Supprimer le trajet ${j + 1}">${icon('trash')}</button>
        </div>
      </div>
    </div>`).join('');
  return `<div class="card">
    ${cardHead('route', cat === 'transfert' ? 'Transfert' : 'Trajets', 'D\'où on part, où on va · nombre de tours', `<span class="sum-badge" data-live="tours-${i}">${t} tour${t > 1 ? 's' : ''}</span>`)}
    ${rows ? `<div class="trajets">${rows}</div>` : ''}
    <button type="button" class="btn-dashed" data-act="add-trajet" data-i="${i}">${icon('plus')}Ajouter un trajet</button>
  </div>`;
}

function materiauxCard(e, i) {
  const u = unitMat(e);
  const names = [...MATERIAUX, ...e.materiaux.map(x => x.nom).filter(n => !MATERIAUX.includes(n))];
  const on = n => e.materiaux.some(x => x.nom === n);
  const blocks = e.materiaux.map((mt, k) => `
    <div class="matblock">
      <div class="mb-head"><strong>${esc(mt.nom)}</strong><span class="mb-total" data-live="mat-${i}-${k}">${fmtNum(mt.pesees.reduce((a, p) => a + num(p.poids), 0))} ${u}</span>
        <button type="button" class="icon-btn sm" data-act="toggle-mat" data-i="${i}" data-name="${esc(mt.nom)}" aria-label="Retirer ${esc(mt.nom)}">${icon('x')}</button></div>
      ${mt.pesees.map((pe, j) => `<div class="pesee">
        ${field({ label: u === 'm³' ? 'Volume' : 'Poids', bind: `engins.${i}.materiaux.${k}.pesees.${j}.poids`, im: 'decimal', ph: '0,00', suffix: u })}
        ${field({ label: 'N° de pesée (option)', bind: `engins.${i}.materiaux.${k}.pesees.${j}.num`, cap: 'code', ph: 'Ticket n°', ic: 'hash' })}
        <button type="button" class="icon-btn sm danger" data-act="del-pesee" data-i="${i}" data-k="${k}" data-j="${j}" aria-label="Supprimer cette pesée"${mt.pesees.length < 2 ? ' style="visibility:hidden" tabindex="-1"' : ''}>${icon('trash')}</button>
      </div>`).join('')}
      <button type="button" class="link-btn" data-act="add-pesee" data-i="${i}" data-k="${k}">${icon('plus')}Ajouter une pesée</button>
    </div>`).join('');
  return `<div class="card">
    ${cardHead('box', 'Matériaux', 'À cocher · quantité = poids, n° de pesée en option', `<span class="sum-badge soft" data-live="mat-total-${i}">${fmtNum(materiauxEngin(e))} ${u}</span>`)}
    <div class="mchips">${names.map(n => `<button type="button" class="mchip" data-act="toggle-mat" data-i="${i}" data-name="${esc(n)}" aria-pressed="${on(n)}"><span class="box">${icon('check')}</span>${esc(n)}</button>`).join('')}</div>
    <div class="add-inline"><input class="input" id="mat-autre-${i}" placeholder="Autre matériau…" aria-label="Autre matériau" enterkeyhint="done"><button type="button" class="btn btn-ghost" data-act="add-mat" data-i="${i}">${icon('plus')}Ajouter</button></div>
    ${blocks ? `<div class="matblocks">${blocks}</div>` : ''}
  </div>`;
}

function lignesCard(bl) {
  const rows = bl.lignes.map((l, i) => `<div class="ligne"><div class="l-fields">
      ${field({ label: 'Désignation', bind: `lignes.${i}.designation`, ph: 'Ex. main d\'œuvre, location godet…', cls: 'f-des' })}
      <div class="field" data-field="lignes.${i}.unite"><label for="f-lignes-${i}-unite">Unité</label><select id="f-lignes-${i}-unite" data-bind="lignes.${i}.unite">${UNITES.map(u => `<option${u === l.unite ? ' selected' : ''}>${u}</option>`).join('')}</select></div>
      ${field({ label: 'Quantité', bind: `lignes.${i}.quantite`, im: 'decimal', ph: '0' })}
    </div><button type="button" class="icon-btn sm danger" data-act="del-ligne" data-i="${i}" aria-label="Supprimer la ligne ${i + 1}">${icon('trash')}</button></div>`).join('');
  return `<div class="card">
    ${cardHead('pen', 'Autres', 'Désignations à la main, hors listes')}
    ${rows ? `<div class="lignes">${rows}</div>` : ''}
    <button type="button" class="btn-dashed" data-act="add-ligne">${icon('plus')}Ajouter une désignation</button>
  </div>`;
}

</script>
<script>
/* =============================================================================
   ASSISTANT (2/2) — Heures · Récapitulatif · Signature · envoi · écran final
   ============================================================================= */
'use strict';

/* ---------------------------------------------------------------- heures -- */
function stepHeures(bl) {
  const engins = enginsRemplis(bl);
  if (!engins.length) return `<div class="card">${emptyState('Choisissez d\'abord le matériel', 'Les heures se notent engin par engin.', 'semi', '<button type="button" class="btn btn-dark btn-sm" data-act="goto" data-step="materiel">Choisir le matériel</button>')}</div>`;
  return engins.map(e => heuresCard(bl, e, bl.engins.indexOf(e), engins.length > 1)).join('') + hoursRecapHtml(bl);
}

function heuresCard(bl, e, i, plusieurs) {
  const c = e.facturation.continu, h = e.horaires, prevu = bl.source?.prevu;
  const period = (label, ic, a, b) => { const d = dur(h[a], h[b]); return `<div class="period" data-engin="${i}">
      <div class="p-head">${icon(ic)}${label}<span class="p-dur${d ? '' : ' zero'}">${fmtH(d)}</span></div>
      <div class="p-times">${timeField('Arrivée chantier', i, a)}<span class="p-arrow">${icon('arrowR')}</span>${timeField('Départ chantier', i, b)}</div></div>`; };
  const tete = plusieurs
    ? `<header class="card-h"><span class="ic">${ill(matById(e.type))}</span><div><h2>${esc(designationEngin(e))}</h2><p>${esc(e.conducteur || 'Conducteur à renseigner')}</p></div><div class="card-h-side"><span class="sum-badge">${fmtH(minutesEngin(e))}</span></div></header>`
    : cardHead('clock', 'Heures', 'Arrivée et départ du chantier, au quart d\'heure');
  return `
  <div class="card">
    ${tete}
    <div class="h-tools">
      <label class="switch"><input type="checkbox" data-bind-bool="engins.${i}.facturation.continu" data-rerender${c ? ' checked' : ''}><span class="track"></span><span>Journée continue</span></label>
      <span class="spacer"></span>
      ${prevu ? `<button type="button" class="chip-btn" data-act="apply-prevu" data-i="${i}">${icon('calendar')}Prévu ${esc(prevu.debut)}–${esc(prevu.fin)}</button>` : ''}
      ${i > 0 ? `<button type="button" class="chip-btn" data-act="copy-heures" data-i="${i}">${icon('copy')}Mêmes heures que le 1er</button>` : ''}
      <button type="button" class="chip-btn" data-act="preset" data-i="${i}">${icon('sparkles')}${c ? '7h30 → 15h30' : '7h30–12h · 13h–17h'}</button>
    </div>
    <div class="periods${c ? ' single' : ''}">
      ${c ? period('Journée continue', 'sun', 'matinArr', 'matinDep') : period('Matin', 'sun', 'matinArr', 'matinDep') + period('Après-midi', 'sunset', 'amArr', 'amDep')}
    </div>
  </div>`;
}

function timeField(label, i, key) {
  const v = state.bl.engins[i].horaires[key];
  return `<div class="tfield${v ? '' : ' empty'}" data-time="engins.${i}.horaires.${key}"><span class="t-label">${label}</span>
    <div class="t-row">
      <button type="button" class="t-step" data-act="t-step" data-i="${i}" data-k="${key}" data-d="-15" aria-label="${label} : moins 15 minutes">${icon('minus')}</button>
      <button type="button" class="t-val" data-act="t-open" data-i="${i}" data-k="${key}" aria-label="${label} : ${v || 'choisir l\'heure'}">${v || '--:--'}</button>
      <button type="button" class="t-step" data-act="t-step" data-i="${i}" data-k="${key}" data-d="15" aria-label="${label} : plus 15 minutes">${icon('plus')}</button>
    </div></div>`;
}

/* Appuis rapides sur − / + : on met à jour les quelques endroits concernés
   au lieu de redessiner toute l'étape. Redessiner remplaçait le bouton sous
   le doigt, et les appuis suivants se perdaient. */
function majHeures(i, cle) {
  const bl = state.bl, e = bl.engins[i], h = e.horaires;
  const champ = $(`[data-time="engins.${i}.horaires.${cle}"]`);
  if (champ) {
    champ.classList.toggle('empty', !h[cle]);
    const val = champ.querySelector('.t-val');
    if (val) val.textContent = h[cle] || '--:--';
    clearFieldError(champ);
  }
  $$(`.period[data-engin="${i}"]`).forEach(p => {
    const [a, b] = $$('[data-time]', p).map(x => x.dataset.time.split('.').pop());
    const d = dur(h[a], h[b]), el = p.querySelector('.p-dur');
    if (el) { el.textContent = fmtH(d); el.classList.toggle('zero', !d); }
  });
  const badge = $(`.period[data-engin="${i}"]`)?.closest('.card')?.querySelector('.card-h-side .sum-badge');
  if (badge) badge.textContent = fmtH(minutesEngin(e));
  const recap = $('.hrecap');
  if (recap) recap.outerHTML = hoursRecapHtml(bl);
}

function hoursRecapHtml(bl) {
  const engins = enginsRemplis(bl), mins = minutesTotal(bl);
  const row = (l, a, b) => `<div class="hr-row"><span>${l}</span><b>${a && b ? `${a} → ${b}` : '—'}</b><em>${fmtH(dur(a, b))}</em></div>`;
  const bloc = e => {
    const h = e.horaires;
    return `${engins.length > 1 ? `<div class="hr-eng">${esc(designationEngin(e))}<em>${fmtH(minutesEngin(e))}</em></div>` : ''}
      ${e.facturation.continu ? row('Journée continue', h.matinArr, h.matinDep) : row('Matin', h.matinArr, h.matinDep) + row('Après-midi', h.amArr, h.amDep)}`;
  };
  return `<div class="hrecap" role="status">
    <div class="hr-top"><span class="eyebrow">Récap des heures</span><span>${esc(cap(frLong(bl.date)))}</span></div>
    <div class="hr-total"><b>${fmtH(mins)}</b><span>soit ${fmtDec(mins)} h${engins.length > 1 ? ' au total' : ''}</span></div>
    <div class="hr-rows">
      ${engins.map(bloc).join('')}
      ${engins.length === 1 ? `<div class="hr-row"><span>Facturation</span><b>${esc(factLine(engins[0]) || '—')}</b><em></em></div>` : ''}
    </div></div>`;
}

/* lignes du bon : tableau sur grand écran, cartes sur téléphone (mobile.css) */
function linesHtml(lines) {
  const table = `<div class="lines-wrap"><table class="lines"><thead><tr><th>Désignation</th><th>Chargement</th><th>Déchargement</th><th class="r">Tours</th><th class="r">Qté</th><th>Unité</th><th>N° pesée</th></tr></thead><tbody>
    ${lines.map(r => `<tr class="${r.type === 'principal' ? 'main' : ''}"><td>${esc(r.designation)}</td><td>${esc(r.depart || '')}</td><td>${esc(r.arrivee || '')}</td><td class="r">${esc(r.tours || '')}</td><td class="r">${esc(r.qte || '')}</td><td>${esc(r.unite || '')}</td><td>${esc(r.pesee || '')}</td></tr>`).join('')}
    </tbody></table></div>`;
  const cards = `<div class="lines-cards">${lines.map(r => {
    const sub = [
      r.depart || r.arrivee ? `<span>${icon('route')}${esc(r.depart || '?')} → ${esc(r.arrivee || '?')}</span>` : '',
      r.tours ? `<span>${esc(r.tours)} tour${+r.tours > 1 ? 's' : ''}</span>` : '',
      r.pesee ? `<span>${icon('hash')}Pesée ${esc(r.pesee)}</span>` : '',
    ].join('');
    return `<div class="lcard${r.type === 'principal' ? ' main' : ''}"><b>${esc(r.designation)}</b><span class="lc-q">${r.qte ? `${esc(r.qte)} ${esc(r.unite || '')}` : ''}</span>${sub ? `<div class="lc-sub">${sub}</div>` : ''}</div>`;
  }).join('')}</div>`;
  return table + cards;
}

/* ----------------------------------------------------------------- récap -- */
function stepRecap(bl) {
  const res = ['chantier', 'materiel', 'prestation', 'heures'].map(s => validate(bl, s));
  const errors = res.flatMap(r => r.errors), warnings = res.flatMap(r => r.warnings);
  const stepName = k => STEPS.find(s => s.key === k)?.label || '';
  const notes = [...errors.map(e => ['note-warn', e]), ...warnings.map(w => ['note-info', w])]
    .map(([cls, [, msg, step]]) => `<div class="note ${cls}">${icon('alert')}<span>${esc(msg)}</span><a href="#/bl/${bl.id}/${step}" class="link">${stepName(step)}</a></div>`).join('');
  const dd = v => (v ? `<dd>${esc(v)}</dd>` : '<dd class="empty">—</dd>');
  const item = (t, v) => `<div><dt>${t}</dt>${dd(v)}</div>`;
  const sec = (title, step, body) => `<section class="rc-sec"><div class="rc-sec-h"><h3>${title}</h3><button type="button" class="btn btn-ghost btn-sm" data-act="goto" data-step="${step}">${icon('pen')}Modifier</button></div>${body}</section>`;
  const lines = lignesBL(bl);
  return `<div class="card">
    ${cardHead('file', 'Récapitulatif', 'À relire avec le chef de chantier avant de signer', `<div class="card-h-side"><button type="button" class="btn btn-soft btn-sm" data-act="preview-pdf">${icon('eye')}Aperçu PDF</button></div>`)}
    ${notes ? `<div class="warns">${notes}</div>` : `<div class="note note-accent" style="margin-bottom:8px">${icon('check')}<span>Tout est complet. Le chef de chantier peut signer.</span></div>`}
    ${sec('Chantier', 'chantier', `<dl class="dl">${item('Date', frDate(bl.date))}${item('Client', bl.client.nom)}${item('Chantier', [bl.chantier.nom, bl.chantier.ville].filter(Boolean).join(' · '))}${item('Adresse chantier', bl.chantier.adresse)}${item('N° chantier', bl.chantier.numero)}${item('N° commande', bl.chantier.commande)}${item('Chef de chantier', bl.chef.nom)}${item('Contact chef', [bl.chef.tel, bl.chef.email].filter(Boolean).join(' · '))}</dl>`)}
    ${sec(bl.engins.length > 1 ? 'Engins & facturation' : 'Matériel & facturation', 'materiel', enginsRemplis(bl).map(e => `<dl class="dl">${item('Matériel', designationEngin(e))}${item(catOf(e) === 'pelle' ? 'N° engin' : 'Immatriculation', e.immat)}${matById(e.type)?.remorque ? item('N° remorque', e.remorque) : ''}${item('Conducteur', e.conducteur)}${item('Facturation', factLine(e))}</dl>`).join('<div class="sep"></div>') || '<p class="muted">Aucun engin.</p>')}
    ${sec('Prestation', 'prestation', lines.length ? `${linesHtml(lines)}${bl.observations ? `<p style="margin-top:12px"><b>Observations :</b> ${esc(bl.observations)}</p>` : ''}` : '<p class="muted">Aucune ligne.</p>')}
    ${sec('Heures', 'heures', hoursRecapHtml(bl))}
  </div>`;
}

/* ------------------------------------------------------------- signature -- */
function stepSignature(bl) {
  const mins = minutesTotal(bl), mode = state.config?.mail?.mode;
  return `<div class="card">
    ${cardHead('pen', 'Signature', 'Chef de chantier · le bon sera numéroté, figé et envoyé')}
    <div class="sig-info">${icon('file')}<div><b>${esc(designationPrincipale(bl) || 'Bon de location')}</b><div class="muted">${esc(bl.client.nom)} · ${esc(frDate(bl.date))}${mins ? ` · <b style="color:var(--ink)">${fmtH(mins)}</b>` : ''}${totalMateriaux(bl) ? ` · ${fmtNum(totalMateriaux(bl))} ${unitMat(bl)}` : ''}</div></div></div>
    <div class="grid g-2" style="margin-top:16px">
      ${field({ label: 'Nom du signataire', bind: 'signature.nom', req: true, cap: 'words', ic: 'user', ac: 'name' })}
      ${field({ label: 'Téléphone du signataire', bind: 'signature.tel', type: 'tel', im: 'tel', ic: 'phone' })}
    </div>
    <div style="margin-top:16px" data-err-anchor="signature.image">
      <p class="label" style="margin-bottom:8px">Signature du chef de chantier<span class="req" aria-hidden="true">*</span></p>
      <div class="sig-wrap" id="sig-wrap">
        <canvas role="img" aria-label="Zone de signature : signer avec le doigt ou un stylet"></canvas>
        <span class="sig-x" aria-hidden="true">×</span>
        <p class="sig-ph">${icon('pen')}Signez ici avec le doigt</p>
        <div class="sig-tools"><button type="button" class="btn btn-ghost btn-sm" data-act="sig-full">${icon('expand')}Plein écran</button><button type="button" class="btn btn-ghost btn-sm" data-act="sig-clear">${icon('refresh')}Effacer</button></div>
      </div>
    </div>
    <div style="margin-top:14px" data-field="signature.cgv">
      <label class="check"><input type="checkbox" data-bind-bool="signature.cgv"${bl.signature.cgv ? ' checked' : ''}><span class="box">${icon('check')}</span>
      <span>Le chef de chantier certifie l'exactitude de ce bon : heures, trajets et quantités.</span></label>
    </div>
    <div class="sep"></div>
    ${field({ label: 'Envoyer le bon signé à', bind: 'chef.email', type: 'email', im: 'email', ic: 'send', ph: 'email du chef de chantier',
      help: mode === 'make' ? 'Le PDF signé part automatiquement à cette adresse.' : mode === 'aucun' ? 'Envoi automatique pas encore branché : le PDF se partagera depuis l\'écran suivant.' : 'Prototype local : le mail est préparé avec le PDF (dossier data/outbox), sans envoi réel.' })}
  </div>`;
}

function mountSignature() {
  const wrap = $('#sig-wrap'); if (!wrap) return;
  state.pad = signaturePad(wrap, {
    initial: state.sig,
    onChange: pad => {
      state.sig = pad.data();
      const a = $('[data-err-anchor="signature.image"]');
      if (a && !pad.isEmpty()) { a.classList.remove('invalid'); a.querySelector('.err-msg')?.remove(); }
      renderLive();
    },
  });
}

/* Signature en plein écran : plus de place pour le chef de chantier (téléphone tourné).
   Le tracé est ensuite ramené à l'échelle du cadre de l'étape Signature. */
function fitStrokes({ strokes }, W, H) {
  const pts = strokes.flatMap(st => st.pts); if (!pts.length) return null;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys), bw = Math.max(1, Math.max(...xs) - minX), bh = Math.max(1, Math.max(...ys) - minY);
  const room = H - 62, k = Math.min((W - 32) / bw, (room - 16) / bh, 1.3), kw = Math.max(.6, Math.min(1, k));
  const ox = (W - bw * k) / 2 - minX * k, oy = Math.max(8, (room - bh * k) / 2) - minY * k;
  return { strokes: strokes.map(st => ({ pts: st.pts.map(([x, y, w]) => [x * k + ox, y * k + oy, Math.max(1.1, w * kw)]) })), w: W, h: H };
}
function openFullSignature() {
  const bl = state.bl;
  const root = document.createElement('div');
  root.className = 'sig-full';
  root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Signature en plein écran');
  root.innerHTML = `
    <div class="sf-bar">
      <button type="button" class="icon-btn" data-sf="close" aria-label="Fermer sans garder la signature">${icon('x')}</button>
      <div><p class="eyebrow">Signature du chef de chantier</p><b>${esc(bl.signature.nom || bl.chef.nom || 'Signataire')}</b></div>
      <button type="button" class="btn btn-ghost btn-sm" data-sf="clear">${icon('refresh')}<span class="hide-xs">Effacer</span></button>
      <button type="button" class="btn btn-accent btn-sm" data-sf="ok">${icon('check')}Valider</button>
    </div>
    <div class="sig-wrap sf-pad"><canvas role="img" aria-label="Zone de signature : signer avec le doigt"></canvas><span class="sig-x" aria-hidden="true">×</span><p class="sig-ph">${icon('pen')}Signez ici avec le doigt</p></div>
    <p class="sf-hint">${icon('rotate')}Tournez le téléphone pour signer plus large</p>`;
  document.body.appendChild(root);
  document.body.style.overflow = 'hidden';
  const big = signaturePad(root.querySelector('.sf-pad'));
  const close = keep => {
    if (keep) {
      const r = $('#sig-wrap canvas')?.getBoundingClientRect();
      state.sig = fitStrokes(big.data(), r?.width || 340, r?.height || 220);
    }
    big.destroy(); root.remove(); document.body.style.overflow = '';
    if (keep) { renderStep({ keepScroll: true }); toast('Signature enregistrée'); }
  };
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-sf]')?.dataset.sf;
    if (a === 'clear') big.clear();
    if (a === 'close') close(false);
    if (a === 'ok') { if (big.isEmpty()) toast('Signez dans le cadre avant de valider', 'error'); else close(true); }
  });
}

const STEP_VIEWS = { chantier: stepChantier, materiel: stepMateriel, prestation: stepPrestation, heures: stepHeures, recap: stepRecap, signature: stepSignature };

/* ------------------------------------------------------ signer & envoyer -- */
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Le chef de chantier appuie souvent deux fois quand le réseau traîne.
   Sans ce verrou, le téléphone refabrique le PDF et relance l'envoi à chaque
   appui — la base refuse la deuxième signature, mais l'erreur s'affiche
   par-dessus l'écran de réussite. */
let signatureEnCours = false;

async function signAndSend() {
  if (signatureEnCours) return;
  const bl = state.bl;
  const res = ['chantier', 'materiel', 'prestation', 'heures', 'signature'].map(s => validate(bl, s));
  const errors = res.flatMap(r => r.errors);
  if (!state.pad || state.pad.isEmpty()) errors.unshift(['signature.image', 'La signature du chef de chantier est obligatoire', 'signature']);
  const ailleurs = errors.filter(e => e[2] !== 'signature');
  if (ailleurs.length) {
    openModal(`<div class="modal-h"><div><p class="eyebrow">Avant de signer</p><h2>Il manque des informations</h2></div><button class="icon-btn sm" data-close aria-label="Fermer">${icon('x')}</button></div>
      <div class="warns">${ailleurs.map(([, msg, step]) => `<div class="note note-warn">${icon('alert')}<span>${esc(msg)}</span><a class="link" href="#/bl/${bl.id}/${step}">${STEPS.find(s => s.key === step).label}</a></div>`).join('')}</div>`);
    return;
  }
  const ici = errors.filter(e => e[2] === 'signature');
  if (ici.length) { showErrors(ici); toast(ici[0][1], 'error'); return; }

  const mode = state.config?.mail?.mode;
  const etapes = [['num', 'Attribution du numéro de bon'], ['pdf', 'Création du PDF signé'], ['save', 'Enregistrement au registre'],
    ['mail', bl.chef.email ? `${mode === 'make' ? 'Envoi' : 'Préparation du mail'} pour ${bl.chef.email}` : 'Envoi au chef de chantier']];
  const root = openModal(`<div class="modal-h"><div><p class="eyebrow">Finalisation</p><h2>Signature en cours</h2></div></div>
    <ul class="proc">${etapes.map(([id, l]) => `<li data-p="${id}"><span class="p-ic">${icon('check')}</span><span>${esc(l)}</span></li>`).join('')}</ul><div id="proc-err"></div>`, { dismissable: false });
  const mark = (id, s) => { const li = root.querySelector(`[data-p="${id}"]`); if (li) li.className = s; };
  let run = 'num';
  signatureEnCours = true;
  try {
    mark('num', 'run'); await saveNow(true);
    const { numero } = await api('POST', `/bons/${bl.id}/numero`); bl.numero = numero; mark('num', 'ok');
    run = 'pdf'; mark('pdf', 'run');
    bl.signature.image = state.pad.toPng(); bl.signature.date = new Date().toISOString(); bl.designation = designationPrincipale(bl);
    const doc = await buildPdf(bl); const b64 = await pdfBase64(doc); await wait(200); mark('pdf', 'ok');
    run = 'save'; mark('save', 'run'); mark('mail', 'run');
    const signed = await api('POST', `/bons/${bl.id}/signer`, { bon: bl, pdfBase64: b64 });
    mark('save', 'ok'); await wait(250);
    mark('mail', ['envoye', 'local'].includes(signed.mail?.statut) ? 'ok' : 'ko');
    memoriserEngins(bl);
    LS.set(CLE('lieux'), [...new Set([...bl.engins.flatMap(e => e.trajets.flatMap(t => [t.depart, t.arrivee])), ...LS.get(CLE('lieux'), [])].filter(Boolean))].slice(0, 30));
    LS.del(CLE(`backup:${bl.id}`));
    // « uid » : l'intervention du planning d'où vient ce bon, pour ne pas la reproposer
    LS.set(CLE('signes'), [{ id: bl.id, numero: bl.numero, date: bl.date, client: bl.client.nom, uid: bl.source?.agendaUid || null, minutes: minutesTotal(bl), statut: signed.statut, le: new Date().toISOString() }, ...LS.get(CLE('signes'), [])].slice(0, 50));
    state.bl = signed; state.sig = null;
    await wait(550);
    closeModal(true);
    location.hash = `#/bl/${signed.id}/ok`;
  } catch (e) {
    bl.signature.image = null; bl.signature.date = null;
    mark(run, 'ko'); if (run === 'save') mark('mail', '');
    root.querySelector('#proc-err').innerHTML = `<div class="note note-warn" style="margin-top:12px">${icon('alert')}<span>${esc(e.message)}</span></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-proc="close">Fermer</button><button type="button" class="btn btn-dark" data-proc="retry">Réessayer</button></div>`;
    root.querySelector('[data-proc="close"]').onclick = () => closeModal();
    root.querySelector('[data-proc="retry"]').onclick = () => { closeModal(true); signAndSend(); };
  } finally { signatureEnCours = false; }
}

/* ---------------------------------------------------------- écran final -- */
function viewDone(bl) {
  const engins = enginsRemplis(bl), mail = bl.mail, mins = minutesTotal(bl);
  const mailBody = !mail ? '<p class="muted">Pas encore envoyé.</p>'
    : mail.statut === 'local' ? `<div class="note note-info">${icon('mail')}<span>Mail préparé pour <b>${esc(mail.to)}</b> avec le PDF en pièce jointe. <br>Prototype local : aucun envoi réel.</span></div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn btn-ghost btn-sm" data-act="mail-preview" data-url="${mail.apercu}">${icon('eye')}Aperçu du mail</button><a class="btn btn-ghost btn-sm" href="${mail.eml}" download>${icon('download')}Fichier .eml</a></div>`
    : mail.statut === 'envoye' ? `<div class="note note-accent">${icon('check')}<span>Envoyé à <b>${esc(mail.to)}</b> le ${esc(frDateTime(mail.le))}.</span></div>`
    : mail.statut === 'attente' ? `<div class="note note-info">${icon('mail')}<span>L'envoi automatique n'est pas encore actif. Utilisez <b>Partager</b> pour envoyer le PDF à <b>${esc(mail.to)}</b> (mail, WhatsApp…).</span></div>`
    : `<div class="note note-warn">${icon('alert')}<span>${esc(mailLabel(mail))}</span></div>`;
  app.innerHTML = `
    <section class="done-hero">
      <div class="done-badge">${icon('check')}</div>
      <p class="eyebrow">Bon de location signé</p>
      <h1 class="display">N° ${esc(bl.numero)}</h1>
      <p class="lead">Signé par <b>${esc(bl.signature?.nom)}</b> le ${esc(frDateTime(bl.signature?.date))}</p>
    </section>
    <div class="done-grid">
      <article class="card rise">
        ${cardHead('file', 'PDF signé', CHAUFFEUR ? 'Envoyé au bureau, rangé au registre' : 'Rangé au registre des bons')}
        <div class="filerow"><span class="fileic">PDF</span><div><b>BL-${esc(bl.numero)}.pdf</b><span>${bl.pdf?.taille ? `${Math.round(bl.pdf.taille / 1024)} Ko · ` : ''}A4 paysage</span></div></div>
        <div class="row" style="margin-top:12px">${bl.pdf ? `<button type="button" class="btn btn-dark btn-sm" data-act="pdf" data-url="${bl.pdf.url}" data-title="BL N° ${esc(bl.numero)}">${icon('eye')}Voir le PDF</button><button type="button" class="btn btn-ghost btn-sm" data-act="pdf-dl" data-url="${bl.pdf.url}" data-name="BL-${esc(bl.numero)}.pdf">${icon('download')}Télécharger</button>${navigator.canShare ? `<button type="button" class="btn btn-accent btn-sm" data-act="pdf-share" data-url="${bl.pdf.url}" data-name="BL-${esc(bl.numero)}.pdf">${icon('send')}Partager</button>` : ''}` : ''}</div>
      </article>
      <article class="card rise" style="animation-delay:.05s">
        ${cardHead('send', 'Chef de chantier', mailLabel(mail))}
        ${mailBody}
        <div class="add-inline"><input class="input" type="email" id="resend-email" value="${esc(bl.chef.email)}" placeholder="email du chef de chantier" aria-label="Email du chef de chantier"><button type="button" class="btn btn-ghost" data-act="resend">${icon('send')}${mail?.statut === 'local' || mail?.statut === 'envoye' ? 'Renvoyer' : 'Envoyer'}</button></div>
      </article>
      <article class="card rise span-2" style="animation-delay:.1s">
        ${cardHead('list', 'Contenu du bon', `${esc(bl.client.nom)} · ${esc([bl.chantier.nom, bl.chantier.ville].filter(Boolean).join(' · '))}`, `<div class="card-h-side"><span class="sum-badge">${fmtH(mins)}</span></div>`)}
        ${engins.map(e => `<div class="row" style="gap:18px;flex-wrap:nowrap;margin-bottom:14px"><div style="width:96px;flex:none;color:var(--accent-ink)">${ill(matById(e.type))}</div><div><b style="font-size:17px">${esc(designationEngin(e))}</b><p class="muted">${esc([e.immat, e.conducteur, factLine(e), minutesEngin(e) ? fmtH(minutesEngin(e)) : ''].filter(Boolean).join(' · '))}</p></div></div>`).join('')}
        ${linesHtml(lignesBL(bl))}
      </article>
    </div>
    <div class="done-actions">
      ${CHAUFFEUR
        ? `<a class="btn btn-ghost" href="#/">${icon('home')}Accueil</a>`
        : `<a class="btn btn-ghost" href="#/bons">${icon('list')}Registre</a>
           <a class="btn btn-ghost" href="${gcalLink(bl)}" target="_blank" rel="noopener">${icon('calendar')}Replanifier dans Google Agenda</a>`}
      <a class="btn btn-dark" href="#/nouveau?dupliquer=${bl.id}">${icon('copy')}Dupliquer</a>
      <a class="btn btn-accent" href="#/nouveau">${icon('plus')}Nouveau bon</a>
    </div>`;
  state.pdfPartage = null;
  if (bl.pdf && navigator.canShare) fichierPdf(bl.pdf.url).then(f => { state.pdfPartage = f; }).catch(() => {});
}

</script>
<script>
/* =============================================================================
   APP — routeur, sauvegarde automatique des brouillons, actions
   ============================================================================= */
'use strict';

/* ------------------------------------------------------- sauvegarde auto -- */
let saveTimer = null;
function setSaveState(s) {
  const el = $('#save-state'); if (!el) return;
  el.dataset.s = s;
  el.textContent = { pending: 'Modifié…', saving: 'Enregistrement…', saved: 'Enregistré', offline: 'Hors ligne · gardé sur l\'appareil' }[s];
}
function scheduleSave() {
  const bl = state.bl; if (!bl || bl.statut !== 'brouillon') return;
  setSaveState('pending');
  LS.set(CLE(`backup:${bl.id}`), { ...bl, majLe: new Date().toISOString(), signature: { ...bl.signature, image: null } });
  clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(), 650);
}
async function saveNow(throwOnError = false) {
  clearTimeout(saveTimer);
  const bl = state.bl; if (!bl || bl.statut !== 'brouillon') return;
  setSaveState('saving');
  try { await api('PUT', `/bons/${bl.id}`, { ...bl, signature: { ...bl.signature, image: null, date: null } }); setSaveState('saved'); }
  catch (e) { setSaveState('offline'); if (throwOnError) throw e; }
}
function changed({ rerender = false } = {}) {
  scheduleSave();
  if (rerender) renderStep({ keepScroll: true }); else refreshLive();
}

/* --------------------------------------------------------------- routeur -- */
const spinnerPage = txt => `<div style="display:grid;place-items:center;gap:14px;padding:90px 0;color:var(--muted)"><div class="spinner"></div>${txt ? `<p>${esc(txt)}</p>` : ''}</div>`;

async function route() {
  if (MODE === 'supabase' && DIRECTION && !Session.employe && !(await connexionAuto())) return viewLogin(messageAuto());
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const seg = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  if (state.modal) closeModal(true);
  const sameBL = seg[0] === 'bl' && state.bl && seg[1] === state.bl.id;
  if (state.bl?.statut === 'brouillon' && !sameBL) await saveNow();
  document.body.classList.toggle('is-wizard', seg[0] === 'bl' && seg[2] !== 'ok');
  renderNav(!seg.length ? 'planning' : seg[0]);
  window.scrollTo({ top: 0, behavior: 'instant' });
  try {
    if (!seg.length) return await viewHome();
    // Registre et réglages : bureau seulement. Depuis le lien des chauffeurs,
    // ces adresses ramènent à l'accueil (et la base refuserait la lecture).
    if (seg[0] === 'bons') return CHAUFFEUR ? location.replace('#/') : await viewRegistre();
    if (seg[0] === 'reglages') return CHAUFFEUR ? location.replace('#/') : await viewReglages();
    if (seg[0] === 'nouveau') return await createBL(q);
    if (seg[0] === 'bl' && seg[1]) return await openBL(seg[1], seg[2] || 'chantier');
    location.replace('#/');
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="card">${emptyState('Impossible d\'ouvrir cette page', e.message, 'autre', '<a class="btn btn-dark btn-sm" href="#/">Retour au planning</a>')}</div>`;
  }
}

async function createBL(q) {
  app.innerHTML = spinnerPage('Préparation du bon…');
  let extra = {}, msg = 'Nouveau bon créé';
  const evUid = q.get('uid'), date = q.get('date'), dup = q.get('dupliquer');
  if (evUid && date) {
    const { events } = await api('GET', `/agenda?from=${date}&to=${date}`);
    const ev = events.find(e => e.uid === evUid);
    // Intervention déjà traitée : on reprend le brouillon au lieu d'ouvrir un second bon.
    if (ev?.bon?.statut === 'brouillon') return location.replace(`#/bl/${ev.bon.id}/chantier`);
    if (ev?.bon && !CHAUFFEUR) return location.replace(`#/bl/${ev.bon.id}/ok`);
    if (ev?.bon) { location.replace('#/'); toast(`Cette intervention a déjà le bon N° ${ev.bon.numero}.`, 'error'); return; }
    if (ev) { extra = fromAgenda(ev); msg = 'Bon prérempli depuis l\'agenda'; }
  } else if (dup) {
    const s = state.bl?.id === dup ? state.bl : await api('GET', `/bons/${dup}`);
    const source = newBL(s);   // convertit au besoin un bon d'avant les engins multiples
    extra = { client: source.client, chantier: source.chantier, chef: source.chef,
      engins: source.engins.map(e => newEngin({ ...e, horaires: { matinArr: '', matinDep: '', amArr: '', amDep: '' },
        trajets: (e.trajets || []).map(t => ({ ...t })),
        materiaux: (e.materiaux || []).map(x => ({ nom: x.nom, pesees: [{ poids: '', num: '' }] })) })),
      lignes: (source.lignes || []).map(l => ({ ...l })) };
    msg = `Bon dupliqué depuis le N° ${s.numero || 'brouillon'}`;
  }
  const premier = newBL(extra);
  if (!premier.engins[0].conducteur) {
    const prefs = LS.get(CLE('prefs'), {});
    premier.engins[0].conducteur = prefs.conducteur || '';
    premier.engins[0].telConducteur = prefs.telConducteur || '';
  }
  const saved = await api('POST', '/bons', premier);
  state.bl = newBL(saved); state.sig = null; state.matTab = null;
  LS.set(CLE(`backup:${saved.id}`), { ...state.bl, majLe: new Date().toISOString() });
  location.replace(`#/bl/${saved.id}/chantier`);
  toast(msg);
}

async function openBL(id, step) {
  if (!state.bl || state.bl.id !== id) {
    app.innerHTML = spinnerPage();
    let bl;
    try { bl = await api('GET', `/bons/${id}`); }
    catch (e) { bl = LS.get(CLE(`backup:${id}`)); if (!bl) throw e; toast('Hors ligne : brouillon de l\'appareil', 'error'); }
    state.bl = newBL(bl); state.sig = null; state.matTab = null;
  }
  const bl = state.bl;
  if (bl.statut !== 'brouillon') {
    document.body.classList.remove('is-wizard');
    if (step !== 'ok') return location.replace(`#/bl/${id}/ok`);
    return viewDone(bl);
  }
  if (step === 'ok' || !STEPS.some(s => s.key === step)) return location.replace(`#/bl/${id}/chantier`);
  if (step === 'signature') {
    if (!bl.signature.nom && bl.chef.nom) bl.signature.nom = bl.chef.nom;
    if (!bl.signature.tel && bl.chef.tel) bl.signature.tel = bl.chef.tel;
  }
  if (!state.bons && DIRECTION) api('GET', '/bons').then(r => { state.bons = r.bons; }).catch(() => {});
  if ($('#stepper')) { state.step = step; renderStep(); } else viewWizard(step);
}

const goStep = key => { location.hash = `#/bl/${state.bl.id}/${key}`; };

/* ---------------------------------------------------------- saisie liée -- */
app.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.bind || !state.bl) return;
  setPath(state.bl, el.dataset.bind, el.value);
  clearFieldError(el);
  changed();
  if (el.dataset.bind === 'chantier.adresse' || el.dataset.bind === 'chantier.ville') majCarte();
});
app.addEventListener('change', e => {
  const el = e.target; if (!state.bl) return;
  if (el.dataset.int !== undefined && el.dataset.bind) {
    const v = Math.max(1, Math.min(99, parseInt(el.value, 10) || 1));
    el.value = v; setPath(state.bl, el.dataset.bind, v); changed();
  } else if (el.dataset.bindBool) {
    setPath(state.bl, el.dataset.bindBool, el.checked);
    clearFieldError(el);
    changed({ rerender: el.dataset.rerender !== undefined });
  } else if (el.dataset.bindRadio) {
    setPath(state.bl, el.dataset.bindRadio, el.value);
    changed({ rerender: true });
  }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target;
  if (el.id?.startsWith('mat-autre-')) { e.preventDefault(); ACTIONS['add-mat']({ dataset: { i: el.id.split('-').pop() } }); return; }
  // touche « Suivant » du clavier : passe au champ suivant de l'étape
  if (!el.matches('#step input[data-bind]')) return;
  e.preventDefault();
  const fields = $$('#step input[data-bind], #step select[data-bind], #step textarea[data-bind]').filter(x => x.offsetParent && !x.disabled);
  const next = fields[fields.indexOf(el) + 1];
  if (next) next.focus(); else el.blur();
});

// Clavier ouvert (téléphone) : les barres fixes du bas s'effacent pour ne pas masquer le champ
const toucher = window.matchMedia('(pointer: coarse)');
const estChampTexte = el => el?.matches?.('input:not([type=checkbox]):not([type=radio]):not([type=date]), textarea');
document.addEventListener('focusin', e => { if (toucher.matches && estChampTexte(e.target)) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!estChampTexte(document.activeElement)) document.body.classList.remove('typing'); }, 60));

/* --------------------------------------------------------------- actions -- */
const setTime = (i, key, v, surPlace) => {
  state.bl.engins[i].horaires[key] = v;
  if (surPlace) { majHeures(i, key); changed(); } else changed({ rerender: true });
};

const ACTIONS = {
  // planning
  week: t => { state.weekStart = addDays(state.weekStart, +t.dataset.d); state.day = state.weekStart === mondayOf(isoDay()) ? isoDay() : state.weekStart; viewHome(); },
  'week-today': () => { state.day = isoDay(); state.weekStart = mondayOf(state.day); viewHome(); },
  // app chauffeurs : aujourd'hui / demain
  jour: t => { state.day = t.dataset.day; $$('[data-act="jour"]').forEach(b => b.setAttribute('aria-selected', String(b === t))); renderEvents(); },
  day: t => { state.day = t.dataset.day; $$('.day').forEach(d => d.setAttribute('aria-pressed', String(d.dataset.day === state.day))); renderEvents(); },
  // registre
  'reg-filter': t => { state.regFilter = t.dataset.f; $$('#reg-filter button').forEach(b => b.setAttribute('aria-selected', String(b === t))); renderRegistre(); },
  'del-draft': async t => {
    if (!(await confirmModal({ title: 'Supprimer ce bon ?', text: 'Ce bon n\'est pas signé : il sera définitivement retiré.', ok: 'Supprimer', danger: true }))) return;
    try { await api('DELETE', `/bons/${t.dataset.id}`); LS.del(CLE(`backup:${t.dataset.id}`)); state.bons = state.bons.filter(b => b.id !== t.dataset.id); if (state.bl?.id === t.dataset.id) state.bl = null; if (CHAUFFEUR) renderBrouillons(); else renderRegistre(); toast('Bon supprimé'); }
    catch (e) { toast(e.message, 'error'); }
  },
  // PDF : lien temporaire en ligne (Supabase), fichier du serveur en local
  pdf: async t => {
    const tel = window.matchMedia('(max-width: 699px)').matches;
    const fenetre = tel ? window.open('', '_blank') : null;      // ouverte tout de suite, sinon iOS la bloque
    try {
      const u = await lienPdf(t.dataset.url);
      if (fenetre) fenetre.location.href = u;
      else openPdfModal(u, t.dataset.title, await lienPdf(t.dataset.url, `${(t.dataset.title || 'BL').replace(/[^A-Za-z0-9-]+/g, '-')}.pdf`));
    } catch (e) { fenetre?.close(); toast(e.message, 'error'); }
  },
  'pdf-dl': async t => {
    try {
      const nom = t.dataset.name || 'BL.pdf';
      const f = await fichierPdf(t.dataset.url);
      if (f) { telechargerBlob(f, nom); return; }
      location.href = await lienPdf(t.dataset.url, nom);
    } catch (e) { toast(e.message, 'error'); }
  },
  'pdf-share': async t => {
    try {
      const fichier = state.pdfPartage || await fichierPdf(t.dataset.url)
        || new File([await (await fetch(await lienPdf(t.dataset.url))).blob()], t.dataset.name, { type: 'application/pdf' });
      if (!navigator.canShare?.({ files: [fichier] })) { toast('Partage impossible sur cet appareil : utilisez Télécharger', 'error'); return; }
      await navigator.share({ files: [fichier], title: fichier.name, text: `Bon de location ${fichier.name.replace(/\.pdf$/, '')} — HK Terrassement` });
    } catch (e) { if (e.name !== 'AbortError') toast(e.message, 'error'); }
  },
  'export-csv': () => { if (!state.bons?.length) { toast('Aucun bon à exporter', 'error'); return; } exporterCsv(state.bons); toast('Tableau exporté'); },
  deconnexion: async () => { if (await confirmModal({ title: 'Se déconnecter ?', text: 'Il faudra ressaisir l\'identifiant et le mot de passe.', ok: 'Se déconnecter' })) deconnexion(); },
  gps: t => ouvrirGps(+t.dataset.lat, +t.dataset.lon, t.dataset.label),
  'copier-adresse': async t => {
    try { await navigator.clipboard.writeText(t.dataset.label); toast('Adresse copiée'); closeModal(); }
    catch { toast('Copie impossible sur cet appareil', 'error'); }
  },
  'copy-tpl': async () => { try { await navigator.clipboard.writeText(agendaDescription()); toast('Modèle copié'); } catch { toast('Copie impossible, sélectionnez le texte', 'error'); } },
  // navigation assistant
  goto: (t, e) => { e.preventDefault(); goStep(t.dataset.step); },
  prev: () => goStep(STEPS[Math.max(0, stepIndex(state.step) - 1)].key),
  next: () => {
    const { errors } = validate(state.bl, state.step);
    if (errors.length) { showErrors(errors); toast(errors.length > 1 ? `${errors.length} champs à compléter` : errors[0][1], 'error'); return; }
    saveNow(); goStep(STEPS[Math.min(STEPS.length - 1, stepIndex(state.step) + 1)].key);
  },
  sign: () => signAndSend(),
  // matériel
  'mat-tab': t => { state.matTab = t.dataset.tab; renderStep({ keepScroll: true }); },
  'pick-mat': t => {
    const i = +t.dataset.i, e = state.bl.engins[i], m = matById(t.dataset.id);
    e.type = m.id; state.matTab = m.cat;
    // la plaque du dernier bon fait avec ce même engin, s'il y en a une
    const su = immatConnue(m.id);
    if (su && !e.immat.trim()) { e.immat = su.immat; if (m.remorque && !e.remorque.trim()) e.remorque = su.remorque || ''; }
    if (!['autre', 'transfert'].includes(m.cat)) e.libreDesignation = '';
    if (!FACT_BY_CAT[m.cat].includes(e.facturation.mode)) e.facturation.mode = FACT_BY_CAT[m.cat][0];
    if ((m.cat === 'camion' || m.cat === 'transfert') && !e.trajets.length) e.trajets.push({ depart: '', arrivee: '', tours: 1 });
    clearErrors();
    changed({ rerender: true });
    if (m.cat === 'autre') { state.focus = `f-engins-${i}-libreDesignation`; renderStep({ keepScroll: true }); }
  },
  // engins du bon
  'add-engin': () => {
    // un engin pas encore choisi : inutile d'en empiler un deuxième par-dessus
    const dernier = state.bl.engins.length - 1;
    if (dernier >= 0 && !matById(state.bl.engins[dernier].type)) {
      toast('Choisissez d\'abord ce véhicule ou cet engin', 'error');
      $(`[data-err-anchor="engins.${dernier}.type"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const prefs = LS.get(CLE('prefs'), {});
    state.bl.engins.push(newEngin({ conducteur: prefs.conducteur || '', telConducteur: prefs.telConducteur || '' }));
    state.matTab = null; clearErrors();
    changed({ rerender: true });
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  },
  'del-engin': async t => {
    const i = +t.dataset.i, e = state.bl.engins[i];
    const nom = designationEngin(e) || `l'engin ${i + 1}`;
    if (matById(e.type) && !(await confirmModal({ title: `Retirer ${nom} ?`, text: 'Ses trajets, matériaux et heures seront retirés du bon.', ok: 'Retirer', danger: true }))) return;
    state.bl.engins.splice(i, 1);
    if (!state.bl.engins.length) state.bl.engins.push(newEngin());
    clearErrors(); changed({ rerender: true });
  },
  'change-engin': t => { const e = state.bl.engins[+t.dataset.i]; state.matTab = catOf(e); Object.assign(e, { type: '', libreDesignation: '', immat: '', remorque: '' }); changed({ rerender: true }); },
  // trajets
  'add-trajet': t => { const tr = state.bl.engins[+t.dataset.i].trajets; const last = tr[tr.length - 1]; tr.push({ depart: last?.arrivee || '', arrivee: '', tours: 1 }); state.focus = `f-engins-${t.dataset.i}-trajets-${tr.length - 1}-${last?.arrivee ? 'arrivee' : 'depart'}`; changed({ rerender: true }); },
  'del-trajet': t => { state.bl.engins[+t.dataset.i].trajets.splice(+t.dataset.j, 1); changed({ rerender: true }); },
  retour: t => { const tr = state.bl.engins[+t.dataset.i].trajets, j = +t.dataset.j, s = tr[j]; tr.splice(j + 1, 0, { depart: s.arrivee, arrivee: s.depart, tours: s.tours }); changed({ rerender: true }); toast('Trajet retour ajouté'); },
  tour: t => { const tj = state.bl.engins[+t.dataset.i].trajets[+t.dataset.j]; tj.tours = Math.max(1, Math.min(99, (parseInt(tj.tours, 10) || 1) + +t.dataset.d)); const inp = t.parentElement.querySelector('input'); if (inp) inp.value = tj.tours; changed(); },
  // matériaux
  'toggle-mat': t => {
    const i = +t.dataset.i, list = state.bl.engins[i].materiaux, name = t.dataset.name, k = list.findIndex(x => x.nom === name);
    if (k >= 0) list.splice(k, 1); else { list.push({ nom: name, pesees: [{ poids: '', num: '' }] }); state.focus = `f-engins-${i}-materiaux-${list.length - 1}-pesees-0-poids`; }
    changed({ rerender: true });
  },
  'add-mat': t => {
    const i = +t.dataset.i, inp = $(`#mat-autre-${i}`); const name = inp?.value.trim(); if (!name) { inp?.focus(); return; }
    const list = state.bl.engins[i].materiaux;
    if (!list.some(x => norm(x.nom) === norm(name))) list.push({ nom: name, pesees: [{ poids: '', num: '' }] });
    state.focus = `f-engins-${i}-materiaux-${list.length - 1}-pesees-0-poids`;
    changed({ rerender: true });
  },
  'add-pesee': t => { const i = +t.dataset.i, mt = state.bl.engins[i].materiaux[+t.dataset.k]; mt.pesees.push({ poids: '', num: '' }); state.focus = `f-engins-${i}-materiaux-${t.dataset.k}-pesees-${mt.pesees.length - 1}-poids`; changed({ rerender: true }); },
  'del-pesee': t => { state.bl.engins[+t.dataset.i].materiaux[+t.dataset.k].pesees.splice(+t.dataset.j, 1); changed({ rerender: true }); },
  // lignes libres
  'add-ligne': () => { state.bl.lignes.push({ designation: '', unite: 'h', quantite: '' }); state.focus = `f-lignes-${state.bl.lignes.length - 1}-designation`; changed({ rerender: true }); },
  'del-ligne': t => { state.bl.lignes.splice(+t.dataset.i, 1); changed({ rerender: true }); },
  // heures
  't-open': t => { const i = +t.dataset.i; openTimeSheet(`engins.${i}.horaires.${t.dataset.k}`, v => setTime(i, t.dataset.k, v)); },
  't-step': t => { const i = +t.dataset.i, k = t.dataset.k, cur = state.bl.engins[i].horaires[k]; setTime(i, k, cur ? fromMin(roundQ(toMin(cur)) + +t.dataset.d) : DEFAULT_T[k], true); },
  preset: t => { const e = state.bl.engins[+t.dataset.i]; if (e.facturation.continu) Object.assign(e.horaires, { matinArr: '07:30', matinDep: '15:30' }); else Object.assign(e.horaires, DEFAULT_T); clearErrors(); changed({ rerender: true }); },
  'copy-heures': t => { const e = state.bl.engins[+t.dataset.i]; Object.assign(e.horaires, state.bl.engins[0].horaires); e.facturation.continu = state.bl.engins[0].facturation.continu; clearErrors(); changed({ rerender: true }); },
  'apply-prevu': t => {
    const p = state.bl.source.prevu, e = state.bl.engins[+t.dataset.i], h = e.horaires;
    const a = fromMin(roundQ(toMin(p.debut))), b = fromMin(roundQ(toMin(p.fin)));
    if (!e.facturation.continu && dur(a, b) >= 6 * 60) Object.assign(h, { matinArr: a, matinDep: '12:00', amArr: '13:00', amDep: b });
    else Object.assign(h, { matinArr: a, matinDep: b, amArr: '', amDep: '' });
    clearErrors(); changed({ rerender: true });
  },
  // récap / signature
  'preview-pdf': async t => {
    t.classList.add('is-busy');
    try { const doc = await buildPdf(state.bl, { apercu: true }); openPdfModal(URL.createObjectURL(doc.output('blob')), 'Aperçu avant signature'); }
    catch (e) { console.error(e); toast('Aperçu impossible : ' + e.message, 'error'); }
    finally { t.classList.remove('is-busy'); }
  },
  'sig-clear': () => { state.pad?.clear(); state.sig = null; },
  'sig-full': () => openFullSignature(),
  // écran final
  'mail-preview': t => openModal(`<div class="modal-h"><div><p class="eyebrow">Mode local</p><h2>Aperçu du mail</h2></div><button class="icon-btn sm" data-close aria-label="Fermer">${icon('x')}</button></div><iframe class="pdf-frame" src="${t.dataset.url}" title="Aperçu du mail" style="background:#F4F2ED"></iframe>`, { cls: 'wide' }),
  resend: async t => {
    const email = $('#resend-email')?.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email || '')) { toast('Adresse email invalide', 'error'); $('#resend-email')?.focus(); return; }
    t.classList.add('is-busy');
    try { state.bl = newBL(await api('POST', `/bons/${state.bl.id}/renvoyer`, { email })); viewDone(state.bl); toast(state.bl.mail?.statut === 'erreur' ? 'Échec de l\'envoi' : 'Mail traité', state.bl.mail?.statut === 'erreur' ? 'error' : 'ok'); }
    catch (e) { toast(e.message, 'error'); t.classList.remove('is-busy'); }
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.closest('.modal-root [data-ts]')) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) fn(t, e);
});

window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

(async function boot() {
  if (MODE === 'supabase' && DIRECTION && !Session.employe && !(await connexionAuto())) return viewLogin(messageAuto());
  try { state.config = await api('GET', '/config'); } catch { /* affiché par les vues */ }
  route();
})();

</script>
</body>
</html>
